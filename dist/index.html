// ---- game/collision.js ----
// VAULT RAIDER - collision. SPEC v0.7 sections 3.5, 4.1, 4.5.
//
// TWO SEPARATE CONCEPTS, and they must stay separate (section 4.1):
//   - COLLISION box: tested against tiles, resolves movement.
//   - HURT box: tested against other actors via aabbOverlap, deals death.
// They are equal in size for PIP and are still two named values, so a feel-gate
// change to one cannot silently move the other.
//
// Corpse blocking is TILE-OCCUPANCY, never AABB (section 3.5). That path
// arrives with corpses at M3; isTileBlocked already takes the hook so movement
// has exactly one place to consult it.
//
// No DOM access. Safe to import from tests/.


function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function isSolidChar(ch) {
  return ch !== TILE_CHARS.FLOOR;
}

function tileAt(mask, tx, ty) {
  if (ty < 0 || ty >= mask.length) return TILE_CHARS.WALL;
  const row = mask[ty];
  if (tx < 0 || tx >= row.length) return TILE_CHARS.WALL;
  return row[tx];
}

function tileAtPx(mask, px, py) {
  return tileAt(mask, Math.floor(px / TUNING.tile), Math.floor(py / TUNING.tile));
}

// Single consultation point for "is this tile solid to PIP right now".
// blockedTiles is an optional Set of "tx,ty" keys - corpses at M3 (section 3.5).
function isTileBlocked(mask, tx, ty, blockedTiles) {
  if (isSolidChar(tileAt(mask, tx, ty))) return true;
  if (blockedTiles && blockedTiles.has(tx + ',' + ty)) return true;
  return false;
}

// Does an axis-aligned box overlap any blocked tile?
function boxHitsTiles(mask, x, y, w, h, blockedTiles) {
  const tx0 = Math.floor(x / TUNING.tile);
  const ty0 = Math.floor(y / TUNING.tile);
  // Tile intervals are half-open; see GEOM in tuning.js.
  const eps = GEOM.boxEdgeEpsilonPx;
  const tx1 = Math.floor((x + w - eps) / TUNING.tile);
  const ty1 = Math.floor((y + h - eps) / TUNING.tile);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (isTileBlocked(mask, tx, ty, blockedTiles)) return true;
    }
  }
  return false;
}

// AXIS-SEPARATED resolution. X is resolved fully, then Y independently.
//
// This is what lets PIP slide along a wall instead of stopping dead when a
// diagonal input drives him into it. Resolving both axes together would make
// every diagonal approach to a corridor wall a full stop, which is the classic
// "sticky corner" arcade movement bug.
//
// Returns the resolved position plus which axes were blocked.
function moveAxisSeparated(x, y, w, h, dx, dy, mask, blockedTiles) {
  let nx = x;
  let ny = y;
  let blockedX = false;
  let blockedY = false;

  if (dx !== 0) {
    const tryX = x + dx;
    if (boxHitsTiles(mask, tryX, y, w, h, blockedTiles)) {
      // Snap flush to the wall rather than leaving a sub-pixel gap, so repeated
      // taps into a wall cannot accumulate drift.
      nx = dx > 0
        ? Math.ceil((x + w) / TUNING.tile) * TUNING.tile - w
        : Math.floor(x / TUNING.tile) * TUNING.tile;
      if (boxHitsTiles(mask, nx, y, w, h, blockedTiles)) nx = x;
      blockedX = true;
    } else {
      nx = tryX;
    }
  }

  if (dy !== 0) {
    const tryY = y + dy;
    if (boxHitsTiles(mask, nx, tryY, w, h, blockedTiles)) {
      ny = dy > 0
        ? Math.ceil((y + h) / TUNING.tile) * TUNING.tile - h
        : Math.floor(y / TUNING.tile) * TUNING.tile;
      if (boxHitsTiles(mask, nx, ny, w, h, blockedTiles)) ny = y;
      blockedY = true;
    } else {
      ny = tryY;
    }
  }

  return { x: nx, y: ny, blockedX, blockedY };
}

// Doorway snap-assist, SPEC section 4.1. REQUIRED, not a nicety.
//
// Slack alone is not enough to make a 1-tile gap enterable: the player must
// otherwise be near-pixel-perfect on the perpendicular axis. When PIP is moving
// toward a gap and is within snapAssistWindowPx of alignment, nudge him
// snapAssistStepPx per tick toward it.
//
// Applies identically to every input source, so it cannot desync a replay.
// Returns the corrected position.
function applyDoorwaySnap(x, y, w, h, dx, dy, mask, blockedTiles) {
  const win = TUNING.player.snapAssistWindowPx;
  const step = TUNING.player.snapAssistStepPx;
  let nx = x;
  let ny = y;

  // CARDINAL ONLY, and this is deliberate - MEASURED, not assumed.
  //
  // game-feel-critic flagged the `dy === 0` / `dx === 0` guards as a blind spot
  // that denied diagonal approaches any assist. That was a reasonable
  // hypothesis and it is wrong: extending the assist to diagonals COLLAPSED the
  // entry window from 924/1436 to 444/1436. On a diagonal both nudges fire, each
  // validated against the pre-nudge position, so the combined result is never
  // checked and the two corrections fight each other into walls.
  //
  // The deeper reason it is not needed: a diagonal already corrects on both
  // axes as it travels, so it self-aligns. Measured un-assisted diagonal entry
  // is 64.3% against 30.9% assisted. Diagonals do not want help.
  //
  // tests/rooms.mjs sweeps diagonal approaches specifically to keep this
  // measured rather than argued.
  if (dx !== 0 && dy === 0) {
    const centerY = y + h / 2;
    const target = (Math.floor(centerY / TUNING.tile) + 0.5) * TUNING.tile;
    const delta = target - centerY;
    if (delta !== 0 && Math.abs(delta) <= win) {
      const move = Math.sign(delta) * Math.min(step, Math.abs(delta));
      // Only assist if it actually unblocks the direction of travel.
      if (!boxHitsTiles(mask, x + dx, y + move, w, h, blockedTiles)) ny = y + move;
    }
  } else if (dy !== 0 && dx === 0) {
    const centerX = x + w / 2;
    const target = (Math.floor(centerX / TUNING.tile) + 0.5) * TUNING.tile;
    const delta = target - centerX;
    if (delta !== 0 && Math.abs(delta) <= win) {
      const move = Math.sign(delta) * Math.min(step, Math.abs(delta));
      if (!boxHitsTiles(mask, x + move, y + dy, w, h, blockedTiles)) nx = x + move;
    }
  }

  return { x: nx, y: ny };
}

function tileCenterPx(t) {
  return t * TUNING.tile + TUNING.tile / 2;
}

// ---- game/entities.js ----
// VAULT RAIDER - entities. SPEC v0.7 sections 3.2, 3.8, 3.9, 4.1, 4.2, 4.3.
//
// M2 scope: PIP in floor view, the arrow, and the WARDEN. Monsters and corpses
// arrive at M3/M6.
//
// No DOM access. Safe to import from tests/.


// --- PIP -------------------------------------------------------------------

function createPlayer(tx, ty) {
  return {
    // Position is the top-left of the COLLISION box, not the sprite.
    x: tileCenterPx(tx) - TUNING.player.hitboxFloor / 2,
    y: tileCenterPx(ty) - TUNING.player.hitboxFloor / 2,
    prevX: 0,
    prevY: 0,
    // PERSISTENT entity facing (section 17.1.1). NOT the input struct's
    // facingLatch, which is a one-tick event. Starts East.
    facing: 2,
    lives: TUNING.player.startingLives,
    invulnTicks: 0,
    alive: true
  };
}

function playerBox(player, inRoom) {
  const s = inRoom ? TUNING.player.hitboxRoom : TUNING.player.hitboxFloor;
  return { x: player.x, y: player.y, w: s, h: s };
}

// Hurt box is a SEPARATE query from the collision box (section 4.1), even
// though the two are currently the same size.
function playerHurtBox(player, inRoom) {
  const s = inRoom ? TUNING.player.hurtboxRoom : TUNING.player.hurtboxFloor;
  return { x: player.x, y: player.y, w: s, h: s };
}

function updatePlayerFloor(player, input, mask, speedMul, blockedTiles) {
  player.prevX = player.x;
  player.prevY = player.y;

  // Section 3.9 / 17.1.1: facing latches on directional INPUT, in the same
  // frame, whether or not movement was possible. Never derived from realized
  // displacement. This assignment happens BEFORE movement on purpose - moving
  // it below the collision resolution would reintroduce exactly that bug.
  if (input.facingLatch !== DIR_NEUTRAL) player.facing = input.facingLatch;

  if (input.dir === DIR_NEUTRAL) return;

  const size = TUNING.player.hitboxFloor;
  const d = DIRS[input.dir];
  const speed = TUNING.player.speedFloor * speedMul;
  const dx = d.dx * speed;
  const dy = d.dy * speed;

  const snapped = applyDoorwaySnap(player.x, player.y, size, size, dx, dy, mask, blockedTiles);
  const moved = moveAxisSeparated(
    snapped.x, snapped.y, size, size, dx, dy, mask, blockedTiles
  );
  player.x = moved.x;
  player.y = moved.y;
}

// --- Arrow -----------------------------------------------------------------
//
// Section 3.8: exactly ONE alive at a time, no separate cooldown. Rate of fire
// is gated purely by "is an arrow alive?", so a long miss is a long vulnerable
// window. Section 3.2: firing in the hall is allowed and USELESS - the arrow is
// real, travels, and passes straight through WARDENs. That is an intended
// newbie trap, not a bug to fix.

function createArrowState() {
  // prevX/prevY exist so the arrow INTERPOLATES like every other actor. It was
  // the one thing rendering un-interpolated next to lerped monsters and PIP,
  // which made a clean miss look like a rendering glitch - on the single object
  // that precision aiming is judged against.
  // `id` increments per spawn so a monster can tell one shot from the next
  // (section 4.4 [v0.9]). Without it, "already rolled for this arrow" cannot be
  // expressed and the roll silently reverts to per-tick.
  return {
    alive: false, x: 0, y: 0, prevX: 0, prevY: 0,
    dir: 2, windup: 0, pending: false, id: 0
  };
}

// THE one fire gate. Floor view and (from M3) room view both call this rather
// than each keeping a copy - section 3.8 is "exactly one arrow alive, ever", and
// two independently-maintained gates is how that stops being true.
function requestFire(arrow) {
  // Ignored while an arrow lives or a windup is already running. No separate
  // cooldown exists, by design: a long miss IS the punishment.
  if (arrow.alive || arrow.pending) return false;
  arrow.pending = true;
  arrow.windup = TUNING.arrow.windupTicks;
  return true;
}

function updateArrow(arrow, player, mask) {
  if (arrow.pending) {
    arrow.windup--;
    if (arrow.windup <= 0) {
      arrow.pending = false;
      arrow.alive = true;
      arrow.id++;
      // Section 4.2: direction is PIP's PERSISTENT ENTITY FACING at the SPAWN
      // tick - not the fire-input tick, and never the input struct. This is
      // what makes re-aiming during the 4-tick windup work.
      arrow.dir = player.facing;
      const size = TUNING.player.hitboxFloor;
      arrow.x = player.x + size / 2;
      arrow.y = player.y + size / 2;
      // Spawn with prev == current so the first rendered frame does not lerp
      // in from wherever the last arrow died.
      arrow.prevX = arrow.x;
      arrow.prevY = arrow.y;
    }
    return;
  }
  if (!arrow.alive) return;

  arrow.prevX = arrow.x;
  arrow.prevY = arrow.y;
  const d = DIRS[arrow.dir];
  arrow.x += d.dx * TUNING.arrow.speed;
  arrow.y += d.dy * TUNING.arrow.speed;

  if (arrow.x < 0 || arrow.y < 0 ||
      arrow.x >= TUNING.logicalW || arrow.y >= TUNING.logicalH) {
    arrow.alive = false;
    return;
  }
  // Despawns on wall. Deliberately does NOT test WARDENs (section 3.2).
  const tx = Math.floor(arrow.x / TUNING.tile);
  const ty = Math.floor(arrow.y / TUNING.tile);
  const row = mask[ty];
  if (!row || row[tx] !== '.') arrow.alive = false;
}

// --- WARDEN ----------------------------------------------------------------
//
// Section 3.1: invulnerable. Not killable, slowable, or divertible.
// Section 4.3: deliberately POOR at navigating corridor barriers. Barriers are
// PIP's only defensive tool. DO NOT add pathfinding here - the bad navigation
// is the mechanic, not a defect.

function createWarden(route, speedMul, handedness) {
  const wp = route.waypoints[route.startIdx % route.waypoints.length];
  return {
    x: tileCenterPx(wp[0]) - TUNING.warden.hurtbox / 2,
    y: tileCenterPx(wp[1]) - TUNING.warden.hurtbox / 2,
    prevX: 0,
    prevY: 0,
    waypoints: route.waypoints,
    routeIdx: route.startIdx % route.waypoints.length,
    speedMul,
    // Corner-clipping state (section 4.3.1). Affects behaviour, so all of it is
    // in the determinism hash. slideSign is fixed HANDEDNESS, set once here and
    // never re-rolled - see updateWarden.
    checkTicks: 0,
    // Seeded to the spawn position, not 0, or the first wedge window measures a
    // span from the origin and can never trip.
    minX: tileCenterPx(wp[0]) - TUNING.warden.hurtbox / 2,
    maxX: tileCenterPx(wp[0]) - TUNING.warden.hurtbox / 2,
    minY: tileCenterPx(wp[1]) - TUNING.warden.hurtbox / 2,
    maxY: tileCenterPx(wp[1]) - TUNING.warden.hurtbox / 2,
    slideTicks: 0,
    slideAxis: 0,
    slideSign: handedness < 0 ? -1 : 1
  };
}

function wardenHurtBox(warden) {
  return { x: warden.x, y: warden.y, w: TUNING.warden.hurtbox, h: TUNING.warden.hurtbox };
}

// bias = min(pursuitBiasCap, pursuitBiasRate * elapsedSec)   [section 4.3]
function wardenPursuitBias(elapsedSec) {
  return Math.min(TUNING.warden.pursuitBiasCap, TUNING.warden.pursuitBiasRate * elapsedSec);
}

// pureChase: section 4.3's intrusion mode. An intruding WARDEN "switches to
// PURE chase" - it does not roll against pursuit bias at all. Reusing the
// patrol path unchanged left the intruder targeting its own spawn door on ~10%
// of ticks forever, because bias caps at pursuitBiasCap (0.9) and can never
// reach 1.0. That is patrol behaviour with a one-point route, not hunting.
function updateWarden(warden, player, mask, elapsedSec, speedMul, rng, pureChase) {
  warden.prevX = warden.x;
  warden.prevY = warden.y;

  const size = TUNING.warden.hurtbox;

  // warden.speedMul already carries the layout's warden multiplier from
  // floorDescriptorFor; speedMul is the floor speed. Do not re-apply
  // TUNING.warden.speedMul here or it compounds.
  const speed = warden.speedMul * speedMul;

  // Each tick, with probability bias, step toward PIP instead of the waypoint.
  // The roll is consumed either way so that RNG consumption order - and
  // therefore replay determinism - does not depend on which mode is active.
  const roll = rng.nextFloat();
  const chase = pureChase ? true : roll < wardenPursuitBias(elapsedSec);

  let targetX;
  let targetY;
  if (chase) {
    targetX = player.x + TUNING.player.hitboxFloor / 2;
    targetY = player.y + TUNING.player.hitboxFloor / 2;
  } else {
    const wp = warden.waypoints[warden.routeIdx];
    targetX = tileCenterPx(wp[0]);
    targetY = tileCenterPx(wp[1]);
  }

  const cx = warden.x + size / 2;
  const cy = warden.y + size / 2;
  const ddx = targetX - cx;
  const ddy = targetY - cy;

  if (!chase && Math.abs(ddx) < speed && Math.abs(ddy) < speed) {
    warden.routeIdx = (warden.routeIdx + 1) % warden.waypoints.length;
    return;
  }

  // Greedy axis stepping, no pathfinding. This is what makes a WARDEN snag on
  // a barrier corner - the intended behaviour per section 4.3.
  const zero = GEOM.zeroStepEpsilonPx;
  const stepX = Math.abs(ddx) < zero ? 0 : Math.sign(ddx) * Math.min(speed, Math.abs(ddx));
  const stepY = Math.abs(ddy) < zero ? 0 : Math.sign(ddy) * Math.min(speed, Math.abs(ddy));

  // DOMINANT AXIS FIRST. moveAxisSeparated always resolves X before Y, which is
  // correct for PIP but wrong for a chaser: a WARDEN one tile north-west of a
  // barrier has a large southward pull and a small eastward one, and X-first
  // spends the tick on the small eastward step straight back into the trap
  // before the southward escape is ever attempted. Measured: warden 0 logged
  // 29523 ticks on a single tile. Resolving the axis it most needs first is
  // still greedy and still has no pathfinding - it just stops the tie-break
  // from actively working against it.
  const yFirst = Math.abs(ddy) > Math.abs(ddx);
  let greedy;
  if (yFirst) {
    greedy = moveAxisSeparated(warden.x, warden.y, size, size, 0, stepY, mask, null);
    greedy = moveAxisSeparated(greedy.x, greedy.y, size, size, stepX, 0, mask, null);
  } else {
    greedy = moveAxisSeparated(warden.x, warden.y, size, size, stepX, 0, mask, null);
    greedy = moveAxisSeparated(greedy.x, greedy.y, size, size, 0, stepY, mask, null);
  }
  // Would the DOMINANT axis alone move? This, not "did anything move", is what
  // ends a slide.
  //
  // Measured: aborting on any greedy movement makes the slide useless. A WARDEN
  // pinned north-west of a barrier still has a small viable eastward step, so
  // one tick of sliding is immediately undone by greed dragging it back east -
  // it never travels the ~8 px needed to clear the barrier column. Resuming
  // only when the blocked axis opens up gives the slide room to work, while
  // still snapping back to the chase the instant the obstacle is cleared.
  const dominantOnly = yFirst
    ? moveAxisSeparated(warden.x, warden.y, size, size, 0, stepY, mask, null)
    : moveAxisSeparated(warden.x, warden.y, size, size, stepX, 0, mask, null);
  const dominantMoves = dominantOnly.x !== warden.x || dominantOnly.y !== warden.y;

  // COMMITTED SLIDE (section 4.3.1). Runs only while greed is genuinely stuck.
  //
  // Aborting the slide the moment greed becomes viable again is load-bearing.
  // A fixed-duration slide that ignores the target throughout was measured and
  // fails: in a 2-tile corridor the WARDEN slides one tile, hits the far wall,
  // reverses, and bounces inside the corridor for the whole slide instead of
  // resuming its approach the instant it clears the obstacle.
  if (warden.slideTicks > 0 && !dominantMoves) {
    warden.slideTicks--;
    const slideSpeed = warden.speedMul * speedMul;
    const sx = warden.slideAxis === 0 ? warden.slideSign * slideSpeed : 0;
    const sy = warden.slideAxis === 1 ? warden.slideSign * slideSpeed : 0;
    const slid = moveAxisSeparated(warden.x, warden.y, size, size, sx, sy, mask, null);
    if (slid.x === warden.x && slid.y === warden.y) {
      warden.slideSign = -warden.slideSign;   // walled that way too
    }
    warden.x = slid.x;
    warden.y = slid.y;
    resetWedgeWindow(warden);
    return;
  }

  warden.slideTicks = 0;
  warden.x = greedy.x;
  warden.y = greedy.y;

  // WEDGE DETECTION (section 4.3.1).
  //
  // Measures the SPAN of motion over a window - the bounding box the WARDEN
  // stayed inside - not net displacement and not "was this tick blocked".
  // Both simpler metrics were measured and both fail:
  //   - "blocked this tick" never fires, because a WARDEN pinned on a barrier
  //     still succeeds on one axis most ticks.
  //   - net displacement never fires against an OSCILLATION: bouncing between
  //     two adjacent tiles is 8 px of travel, so the endpoints of a window
  //     routinely sit further apart than any sane threshold.
  // Warden 1 logged 30883 visits to a single tile over 600 s while passing
  // both checks. A span check catches standstill and oscillation alike, and
  // normal patrol covers ~38 px per window so it never false-positives.
  warden.minX = Math.min(warden.minX, warden.x);
  warden.maxX = Math.max(warden.maxX, warden.x);
  warden.minY = Math.min(warden.minY, warden.y);
  warden.maxY = Math.max(warden.maxY, warden.y);
  warden.checkTicks++;

  if (warden.checkTicks >= UNSTICK.afterTicks) {
    const span = Math.max(warden.maxX - warden.minX, warden.maxY - warden.minY);
    if (span < UNSTICK.minSpanPx) {
      // Slide perpendicular to whichever axis it most wanted to travel.
      warden.slideAxis = Math.abs(ddx) > Math.abs(ddy) ? 1 : 0;
      warden.slideTicks = UNSTICK.slideTicks;
    }
    resetWedgeWindow(warden);
  }
}

function resetWedgeWindow(warden) {
  warden.checkTicks = 0;
  warden.minX = warden.x;
  warden.maxX = warden.x;
  warden.minY = warden.y;
  warden.maxY = warden.y;
}

// Section 3.1: nothing kills a WARDEN. Contact kills PIP.
function wardenTouchesPlayer(warden, player, inRoom) {
  const p = playerHurtBox(player, inRoom);
  const w = wardenHurtBox(warden);
  return aabbOverlap(p.x, p.y, p.w, p.h, w.x, w.y, w.w, w.h);
}

// --- PIP in room view ------------------------------------------------------

function updatePlayerRoom(player, input, tiles, speedMul, blockedTiles) {
  player.prevX = player.x;
  player.prevY = player.y;

  // Section 3.9: same rule as floor view, same order. Facing first, from input,
  // regardless of whether the move lands.
  if (input.facingLatch !== DIR_NEUTRAL) player.facing = input.facingLatch;
  if (input.dir === DIR_NEUTRAL) return;

  const size = TUNING.player.hitboxRoom;
  const d = DIRS[input.dir];
  const speed = TUNING.player.speedRoom * speedMul;
  const dx = d.dx * speed;
  const dy = d.dy * speed;

  // 6x6 box in an 8px gap is 1px of slack per side. This is where snap-assist
  // finally earns its place, or fails to - tests/rooms.mjs measures which.
  const snapped = applyDoorwaySnap(player.x, player.y, size, size, dx, dy, tiles, blockedTiles);
  const moved = moveAxisSeparated(snapped.x, snapped.y, size, size, dx, dy, tiles, blockedTiles);
  player.x = moved.x;
  player.y = moved.y;
}

// --- CRAWLER ---------------------------------------------------------------
//
// Section 4.4: perimeter / wall-following, predictable, LOW dodge, 1 HP.
// "Corners PIP in dead ends." Predictability is the point - it is the floor-1
// teaching monster and must be readable at a glance.

function createMonster(def, rng) {
  return {
    type: def.type,
    dodge: def.dodge,
    hp: 1,
    x: tileCenterPx(def.tx) - TUNING.monster.hurtbox / 2,
    y: tileCenterPx(def.ty) - TUNING.monster.hurtbox / 2,
    prevX: 0,
    prevY: 0,
    // Wall-following state. Starts heading East, keeping its left hand on the
    // wall; handedness alternates by spawn parity so four CRAWLERs do not all
    // circulate the same way.
    dir: 2,
    hand: (def.tx + def.ty) % 2 === 0 ? 1 : -1,
    alive: true,
    // Section 4.4 [v0.9]: the dodge roll happens ONCE per arrow per monster, on
    // first entry into the lookahead window. This holds the id of the arrow
    // already rolled for, so a monster cannot re-roll every tick.
    dodgedArrowId: -1,
    spawnTx: def.tx,
    spawnTy: def.ty,
    seed: rng.nextU32()
  };
}

function monsterHurtBox(monster) {
  return { x: monster.x, y: monster.y, w: TUNING.monster.hurtbox, h: TUNING.monster.hurtbox };
}

// Turn order for a wall-follower: try to turn toward the wall-hand first, then
// straight on, then away, then reverse. That is what produces perimeter runs
// and dead-end cornering rather than random drift.
function crawlerTurnOrder(dir, hand) {
  const right = (dir + 2 * hand + DIR_COUNT) % DIR_COUNT;
  const left = (dir - 2 * hand + DIR_COUNT) % DIR_COUNT;
  return [right, dir, left, (dir + 4) % DIR_COUNT];
}

function updateMonster(monster, tiles, speedMul) {
  if (!monster.alive) return;
  monster.prevX = monster.x;
  monster.prevY = monster.y;

  const size = TUNING.monster.hurtbox;
  const speed = TUNING.player.speedRoom * speedMul * ARCHETYPE.crawlerSpeedFrac;

  for (const candidate of crawlerTurnOrder(monster.dir, monster.hand)) {
    const d = DIRS[candidate];
    const moved = moveAxisSeparated(
      monster.x, monster.y, size, size, d.dx * speed, d.dy * speed, tiles, null
    );
    if (moved.x !== monster.x || moved.y !== monster.y) {
      monster.x = moved.x;
      monster.y = moved.y;
      monster.dir = candidate;
      return;
    }
  }
  // Fully boxed in. Reverse and try again next tick.
  monster.dir = (monster.dir + 4) % DIR_COUNT;
}

function monsterTouchesPlayer(monster, player) {
  if (!monster.alive) return false;
  const p = playerHurtBox(player, true);
  const m = monsterHurtBox(monster);
  return aabbOverlap(p.x, p.y, p.w, p.h, m.x, m.y, m.w, m.h);
}

// Section 4.4 [v0.9]: ONE roll per arrow per monster, taken the first time that
// arrow is inside dodgeLookahead and aligned to the monster's axis.
//
// dodgeSkill values are PER-SHOT probabilities. Rolling every tick compounded
// them: a 3.5px/tick arrow spends ~7 ticks in a 24px window, turning LOW 0.15
// into 68%, MED 0.45 into 98.5%, and HIGH 0.80 into 99.999% - unhittable rather
// than hard. Only LOW shipped at M3, so only LOW was ever observed; BRUTE and
// BLINKER at HIGH would have surfaced it at M6 as "the game is broken".
function monsterDodgeCheck(monster, arrow, rng, tiles) {
  if (!monster.alive || !arrow.alive) return false;
  // Already resolved this arrow. Not a re-roll, not a second chance.
  if (monster.dodgedArrowId === arrow.id) return false;

  const mx = monster.x + TUNING.monster.hurtbox / 2;
  const my = monster.y + TUNING.monster.hurtbox / 2;
  const dist = Math.hypot(arrow.x - mx, arrow.y - my);
  if (dist > TUNING.arrow.dodgeLookahead) return false;

  const shot = DIRS[arrow.dir];
  const aligned = shot.diagonal
    ? true
    : (shot.dx !== 0 ? Math.abs(arrow.y - my) < TUNING.tile : Math.abs(arrow.x - mx) < TUNING.tile);
  if (!aligned) return false;

  // Committed: this monster has now had its one roll against this arrow,
  // whichever way it goes.
  monster.dodgedArrowId = arrow.id;

  const skill = TUNING.dodgeSkill[monster.dodge];
  const chance = skill * (shot.diagonal ? TUNING.monster.diagonalDodgeMul : 1.0);
  if (rng.nextFloat() >= chance) return false;

  // Sidestep one tile perpendicular to the shot.
  const perp = shot.dx !== 0 ? { dx: 0, dy: 1 } : { dx: 1, dy: 0 };
  const sign = rng.nextFloat() < 0.5 ? -1 : 1;
  const size = TUNING.monster.hurtbox;
  const moved = moveAxisSeparated(
    monster.x, monster.y, size, size,
    perp.dx * TUNING.tile * sign, perp.dy * TUNING.tile * sign, tiles, null
  );
  monster.x = moved.x;
  monster.y = moved.y;
  return true;
}

// --- Corpses ---------------------------------------------------------------
//
// Section 3.5, and the reason section 4.1's death handling exists.
//
// BLOCKING IS TILE-OCCUPANCY. LETHALITY IS AABB. They are two different tests
// and must not be collapsed: PIP's collision box is 6x6, so an AABB-only corpse
// leaves 2px of slack in an 8px doorway and PIP squeezes past - which silently
// deletes the doorway seal this mechanic exists to create.

function createCorpse(x, y) {
  return {
    // Snapped to the tile it occupies, because occupancy is the blocking rule.
    tx: Math.floor((x + TUNING.monster.hurtbox / 2) / TUNING.tile),
    ty: Math.floor((y + TUNING.monster.hurtbox / 2) / TUNING.tile),
    phase: 0,
    phaseTicks: 0
  };
}

function corpseTileKey(corpse) {
  return corpse.tx + ',' + corpse.ty;
}

// Corpses block PIP ONLY. Monsters and WARDENs walk through them
// (TUNING.corpse.blocksMonsters / blocksWarden, both false).
function corpseBlockedTiles(room) {
  const set = new Set();
  for (const corpse of room.corpses) set.add(corpseTileKey(corpse));
  return set;
}

function updateCorpses(room) {
  const phaseTicks = Math.round(TUNING.corpse.phaseSec / TUNING.dt);
  for (let i = room.corpses.length - 1; i >= 0; i--) {
    const corpse = room.corpses[i];
    corpse.phaseTicks++;
    if (corpse.phaseTicks >= phaseTicks) {
      corpse.phaseTicks = 0;
      corpse.phase++;
      if (corpse.phase >= TUNING.corpse.decayPhases) room.corpses.splice(i, 1);
    }
  }
}

// Section 3.6, CONTESTED between two sources. Both modes implemented; decided
// by playtest, not argument.
function shootCorpse(room, corpse) {
  if (TUNING.flags.CORPSE_SHOT_MODE === 'RESET_ALL') {
    for (const c of room.corpses) { c.phase = 0; c.phaseTicks = 0; }
  } else {
    corpse.phase = 0;
    corpse.phaseTicks = 0;
  }
}

function corpseAtPixel(room, px, py) {
  const tx = Math.floor(px / TUNING.tile);
  const ty = Math.floor(py / TUNING.tile);
  for (const corpse of room.corpses) {
    if (corpse.tx === tx && corpse.ty === ty) return corpse;
  }
  return null;
}

// Lethality is AABB against PIP's hurt box, NOT tile occupancy.
function corpseTouchesPlayer(corpse, player) {
  const p = playerHurtBox(player, true);
  return aabbOverlap(
    p.x, p.y, p.w, p.h,
    corpse.tx * TUNING.tile, corpse.ty * TUNING.tile, TUNING.tile, TUNING.tile
  );
}

// ---- game/room.js ----
// VAULT RAIDER - room view. SPEC v0.8 sections 2, 3.3, 3.5, 3.7, 3.12, 5, 7.2.
//
// Room view is COMBAT UNDER A CLOCK. Floor view is evasion. The two-view
// structure is the game.
//
// The clock is NOT owned here. It is per-FLOOR (section 3.4) and ticks in
// state.js before phase dispatch, including while a room is open. Nothing in
// this file may read or write floor.elapsedTicks.
//
// No DOM access. Safe to import from tests/.


function createRoomRuntime(roomId, entryDoor, rng) {
  const def = ROOM_DEFS[roomId];
  const monsters = [];
  for (const spawn of def.spawnOnEntry) monsters.push(createMonster(spawn, rng));

  return {
    def,
    id: roomId,
    tiles: def.tiles,
    entryDoor,
    monsters,
    corpses: [],
    // NO arrow here. PIP has ONE bow, so there is ONE arrow, and it lives on
    // the floor runtime alongside PIP because both persist across room entry
    // and exit. A per-view arrow object let PIP fire in the hall, walk into a
    // room while it was still flying, and fire again - two arrows alive at
    // once, which section 3.8 forbids. Measured before the fix.
    treasureTaken: false,
    // Section 3.3: once a WARDEN intrudes it NEVER leaves. The only escape is
    // leaving the room.
    intruder: null,
    exitedBy: null,
    rng
  };
}

// PIP enters standing on the door tile, nudged one tile into the room so he is
// not straddling the threshold.
function roomEntryPosition(def, door) {
  const inward = door.side === 'N' ? { dx: 0, dy: 1 }
    : door.side === 'S' ? { dx: 0, dy: -1 }
      : door.side === 'W' ? { dx: 1, dy: 0 } : { dx: -1, dy: 0 };
  const size = TUNING.player.hitboxRoom;
  return {
    x: tileCenterPx(door.tx + inward.dx) - size / 2,
    y: tileCenterPx(door.ty + inward.dy) - size / 2
  };
}

// Section 3.7: while standing on the pickup point PIP cannot be killed.
// Camping to let monsters drift away is INTENDED, not a bug to close.
function playerOnSafeTile(room, player) {
  if (!room.def.treasure.safeTile) return false;
  const t = room.def.treasure;
  const p = playerHurtBox(player, true);
  return aabbOverlap(
    p.x, p.y, p.w, p.h,
    t.tx * TUNING.tile, t.ty * TUNING.tile, TUNING.tile, TUNING.tile
  );
}

function playerOnDoor(room, player) {
  const size = TUNING.player.hitboxRoom;
  const cx = Math.floor((player.x + size / 2) / TUNING.tile);
  const cy = Math.floor((player.y + size / 2) / TUNING.tile);
  for (const door of room.def.doors) {
    if (door.tx === cx && door.ty === cy) return door;
  }
  return null;
}

// Section 3.3: past floorTimerSec a WARDEN enters through a door and hunts.
function spawnIntrusionWarden(room, descriptor) {
  if (room.intruder) return;
  const door = room.def.doors[room.rng.nextInt(room.def.doors.length)];
  room.intruder = createWarden(
    { waypoints: [[door.tx, door.ty]], startIdx: 0 },
    descriptor.wardenSpeedMul,
    1
  );
}

function updateRoom(room, player, arrow, input, descriptor, elapsedSec) {
  const speedMul = descriptor.speedMul;

  // Corpses block PIP ONLY, by TILE OCCUPANCY (section 3.5). Monsters and the
  // intruding WARDEN are never given this set.
  const blocked = corpseBlockedTiles(room);
  updatePlayerRoom(player, input, room.tiles, speedMul, blocked);

  if (input.fire) requestFire(arrow);
  updateArrow(arrow, player, room.tiles);

  // Arrow resolution. Order matters: dodge first, then hit.
  if (arrow.alive) {
    for (const monster of room.monsters) {
      monsterDodgeCheck(monster, arrow, room.rng, room.tiles);
    }
    for (const monster of room.monsters) {
      if (!monster.alive) continue;
      const m = monsterHurtBox(monster);
      if (aabbOverlap(arrow.x, arrow.y, 1, 1, m.x, m.y, m.w, m.h)) {
        monster.hp--;
        arrow.alive = false;
        if (monster.hp <= 0) {
          monster.alive = false;
          room.corpses.push(createCorpse(monster.x, monster.y));
        }
        break;
      }
    }
  }
  // Section 3.6: shooting a corpse is punished.
  if (arrow.alive) {
    const hit = corpseAtPixel(room, arrow.x, arrow.y);
    if (hit) {
      shootCorpse(room, hit);
      arrow.alive = false;
    }
  }

  for (const monster of room.monsters) updateMonster(monster, room.tiles, speedMul);
  updateCorpses(room);

  // Section 3.3 intrusion. The clock is per-FLOOR and is read, never written.
  if (!room.intruder && elapsedSec >= descriptor.floorTimerSec) {
    spawnIntrusionWarden(room, descriptor);
  }
  if (room.intruder) {
    // Section 4.3: PURE chase, ignores geometry cost. The trailing `true` is
    // load-bearing - without it the intruder rolls against pursuit bias like a
    // patrol WARDEN and heads back to its spawn door on ~10% of ticks forever.
    // Corpses do not block it (blocksWarden is false).
    updateWarden(room.intruder, player, room.tiles, elapsedSec, speedMul, room.rng, true);
  }

  // Treasure pickup. Section 3.12: trap rooms spawn on PICKUP, not on entry.
  if (!room.treasureTaken) {
    const t = room.def.treasure;
    const p = playerHurtBox(player, true);
    if (aabbOverlap(p.x, p.y, p.w, p.h,
      t.tx * TUNING.tile, t.ty * TUNING.tile, TUNING.tile, TUNING.tile)) {
      room.treasureTaken = true;
      for (const spawn of room.def.spawnOnPickup) {
        room.monsters.push(createMonster(spawn, room.rng));
      }
    }
  }

  // Death checks. The safe tile beats everything (section 3.7).
  let death = false;
  if (player.invulnTicks > 0) {
    player.invulnTicks--;
  } else if (!playerOnSafeTile(room, player)) {
    for (const monster of room.monsters) {
      if (monsterTouchesPlayer(monster, player)) death = true;
    }
    for (const corpse of room.corpses) {
      if (corpseTouchesPlayer(corpse, player)) death = true;
    }
    if (room.intruder && wardenTouchesPlayer(room.intruder, player, true)) death = true;
  }

  const door = playerOnDoor(room, player);
  return { death, exitDoor: death ? null : door };
}

function roomTreasureValue(descriptor) {
  return descriptor.treasureValue;
}

// Section 4.1 death handling: unlooted rooms reset to their entry spawn state.
// Looted rooms stay looted, and are never rebuilt.
function resetUnlootedRoom(room) {
  room.monsters.length = 0;
  for (const spawn of room.def.spawnOnEntry) {
    room.monsters.push(createMonster(spawn, room.rng));
  }
  room.corpses.length = 0;
  room.intruder = null;
  room.treasureTaken = false;
}

function roomHasIntruder(room) {
  return room.intruder !== null;
}

// Section 3.3 / 10: the siren begins intrusionWarnSec BEFORE entry, and
// section 11 forbids audio-only information - so this drives an on-screen
// indicator too, not just the sound.
function intrusionWarningLevel(descriptor, elapsedSec) {
  const warn = TUNING.warden.intrusionWarnSec;
  const remain = descriptor.floorTimerSec - elapsedSec;
  if (remain > warn) return 0;
  if (remain <= 0) return 1;
  return 1 - remain / warn;
}

const ROOM_EXIT_DIRS = DIRS;
const ROOM_DIR_NEUTRAL = DIR_NEUTRAL;

// ---- game/floor.js ----
// VAULT RAIDER - floor view. SPEC v0.7 sections 2, 3.2, 3.4, 4.3.
//
// Floor view is EVASION. Room view (M3) is combat under a clock.
//
// No DOM access. Safe to import from tests/.


function createFloorRuntime(floorIndex, rng) {
  const descriptor = floorDescriptorFor(floorIndex, TUNING);
  const layout = descriptor.layout;

  const wardens = [];
  for (let i = 0; i < descriptor.wardenCount; i++) {
    // More WARDENs than routes on deep floors: reuse routes, offset the start
    // waypoint so they do not stack on one another.
    const route = layout.wardenRoutes[i % layout.wardenRoutes.length];
    // Alternating handedness so two WARDENs wedged on the same barrier scrape
    // around it opposite ways rather than trailing each other.
    wardens.push(createWarden({
      waypoints: route.waypoints,
      startIdx: route.startIdx + Math.floor(i / layout.wardenRoutes.length)
    }, descriptor.wardenSpeedMul, i % 2 === 0 ? 1 : -1));
  }

  return {
    descriptor,
    layout,
    mask: layout.mask,
    player: createPlayer(layout.spawn.tx, layout.spawn.ty),
    arrow: createArrowState(),
    wardens,
    // Per-FLOOR intrusion clock (section 3.4). Set ONLY here, at floor start.
    elapsedTicks: 0,
    // Room seal state (section 2.4) and live room runtimes, keyed by room id.
    // `looted` survives death; `rooms` does not, for unlooted rooms (4.1).
    looted: {},
    rooms: {},
    rng
  };
}

// SPEC 3.4 - THE central scoring tension.
//
// Called from updateGame BEFORE phase dispatch, on EVERY phase: floor view,
// room view, zoom transitions, and death. There is deliberately no condition
// on this function and no caller may add one. It resets only when a new floor
// starts, which is createFloorRuntime and nowhere else.
function tickFloorTimer(floor) {
  floor.elapsedTicks++;
}

function floorElapsedSec(floor) {
  return floor.elapsedTicks * TUNING.dt;
}

function updateFloor(floor, input) {
  const speedMul = floor.descriptor.speedMul;

  // Corpses block PIP only (section 3.5) and do not exist until M3, so the
  // blocked-tile set is null here. WARDENs are never passed one - they are
  // unblockable by corpses by definition (TUNING.corpse.blocksWarden).
  updatePlayerFloor(floor.player, input, floor.mask, speedMul, null);

  // Section 3.2: hall firing is enabled and useless. The arrow is real.
  if (input.fire && TUNING.flags.HALL_FIRE_ENABLED) {
    requestFire(floor.arrow);
  }
  updateArrow(floor.arrow, floor.player, floor.mask);

  const elapsed = floorElapsedSec(floor);
  for (const warden of floor.wardens) {
    updateWarden(warden, floor.player, floor.mask, elapsed, speedMul, floor.rng);
  }

  // Contact kills unless PIP is in respawn invulnerability.
  if (floor.player.invulnTicks > 0) {
    floor.player.invulnTicks--;
    return { death: false };
  }
  for (const warden of floor.wardens) {
    if (wardenTouchesPlayer(warden, floor.player, false)) return { death: true };
  }
  return { death: false };
}

function respawnPlayerOnFloor(floor) {
  const spawn = floor.layout.spawn;
  const fresh = createPlayer(spawn.tx, spawn.ty);
  floor.player.x = fresh.x;
  floor.player.y = fresh.y;
  floor.player.prevX = fresh.x;
  floor.player.prevY = fresh.y;
  floor.player.facing = fresh.facing;
  floor.player.invulnTicks = Math.round(TUNING.player.respawnInvulnSec / TUNING.dt);
  // Arrow does not survive a death.
  floor.arrow.alive = false;
  floor.arrow.pending = false;
}

// Which room door is PIP standing on, if any. Returns the room entry with its
// id and side so state.js can begin the zoom.
function doorUnderPlayer(floor) {
  const size = TUNING.player.hitboxFloor;
  const cx = Math.floor((floor.player.x + size / 2) / TUNING.tile);
  const cy = Math.floor((floor.player.y + size / 2) / TUNING.tile);
  for (const room of floor.layout.rooms) {
    if (room.door.tx === cx && room.door.ty === cy) {
      // Side is which way PIP steps back OUT onto the corridor.
      const side = room.door.ty < TUNING.gridH / 2 ? 'N' : 'S';
      return { id: room.id, tx: room.door.tx, ty: room.door.ty, side };
    }
  }
  return null;
}

function isStairsUnlocked(floor) {
  const rooms = floor.layout.rooms;
  for (const room of rooms) if (!floor.looted[room.id]) return false;
  return true;
}

function floorLayoutCount() {
  return FLOOR_LAYOUTS.length;
}

// ---- game/state.js ----
// VAULT RAIDER - root state and phase machine. SPEC v0.7 sections 8, 4.1, 12.1.1.
//
// updateGame is THE single update entry point. Its shape carries two invariants
// that CLAUDE.md lists as the mechanics that keep getting broken:
//
//   1. tickFloorTimer runs BEFORE phase dispatch, unconditionally, on every
//      phase. There is no code path that skips, pauses, or resets it.
//   2. applyPlayerDeath is one function in one file, so the corpse clear,
//      unlooted-room reset, and "do not touch the timer" rule are auditable as
//      a single thing.
//
// No DOM access. Safe to import from tests/.


function createGameState(seed, floorIndex) {
  const rng = createRng(seed);
  const state = {
    seed,
    rng,
    tick: 0,
    phase: GAME_PHASES.FLOOR_VIEW,
    phaseTicks: 0,
    score: 0,
    floorIndex: floorIndex || 0,
    floor: null,
    deathFreezeTicks: 0,
    gameOver: false,
    // Room view. Section 8: FLOOR_VIEW <-> ROOM_ZOOM_IN -> ROOM_VIEW -> ZOOM_OUT.
    room: null,
    pendingRoomId: null,
    pendingDoor: null,
    // Zoom is measured in TICKS, never in ms (section 8).
    zoomTicks: 0,
    // Saved so PIP returns to the floor door he entered by.
    floorReturn: null
  };
  startFloor(state, state.floorIndex);
  return state;
}

// THE ONLY PLACE THE FLOOR TIMER RESETS. Not on room exit, not on death,
// not during a zoom transition (section 3.4).
function startFloor(state, floorIndex) {
  state.floorIndex = floorIndex;
  state.floor = createFloorRuntime(floorIndex, state.rng);
  transitionPhase(state, GAME_PHASES.FLOOR_VIEW);
}

function transitionPhase(state, phase) {
  state.phase = phase;
  state.phaseTicks = 0;
}

function updateGame(state, input) {
  state.tick++;
  state.phaseTicks++;

  // 1. The per-FLOOR intrusion clock. UNCONDITIONAL. Every phase, always.
  //    Do not wrap this in a condition. Do not move it below the dispatch.
  tickFloorTimer(state.floor);

  // 2. Phase dispatch.
  switch (state.phase) {
    case GAME_PHASES.FLOOR_VIEW: {
      const result = updateFloor(state.floor, input);
      if (result.death) { applyPlayerDeath(state); break; }
      // Touching an unlooted room door begins the zoom.
      const door = doorUnderPlayer(state.floor);
      if (door && !state.floor.looted[door.id] && ROOM_DEFS[door.id]) {
        beginRoomZoomIn(state, door);
      }
      break;
    }
    case GAME_PHASES.ROOM_ZOOM_IN: {
      // Non-interactive. The floor clock keeps running through it - that is
      // handled above, unconditionally, and must not be special-cased here.
      state.zoomTicks++;
      if (state.zoomTicks >= TUNING.zoom.durationTicks) enterRoom(state);
      break;
    }
    case GAME_PHASES.ROOM_VIEW: {
      const result = updateRoom(
        state.room, state.floor.player, state.floor.arrow, input,
        state.floor.descriptor, floorElapsedSec(state.floor)
      );
      if (result.death) { applyPlayerDeath(state); break; }
      if (result.exitDoor) beginRoomZoomOut(state);
      break;
    }
    case GAME_PHASES.ROOM_ZOOM_OUT: {
      state.zoomTicks++;
      if (state.zoomTicks >= TUNING.zoom.durationTicks) leaveRoom(state);
      break;
    }
    case GAME_PHASES.PLAYER_DEATH: {
      state.deathFreezeTicks--;
      if (state.deathFreezeTicks <= 0) {
        if (state.floor.player.lives > 0) {
          respawnPlayerOnFloor(state.floor);
          transitionPhase(state, GAME_PHASES.FLOOR_VIEW);
        } else {
          state.gameOver = true;
          transitionPhase(state, GAME_PHASES.GAME_OVER);
        }
      }
      break;
    }
    case GAME_PHASES.GAME_OVER:
    default:
      break;
  }
}

// --- room transitions ------------------------------------------------------
//
// Section 8: 24-tick scale-lerp, non-interactive, measured in TICKS never ms.
// THE FLOOR INTRUSION TIMER KEEPS RUNNING THROUGHOUT. That is guaranteed
// structurally by tickFloorTimer sitting above the phase dispatch, not by
// anything in these functions - do not add a pause here.

// An arrow in flight does not survive a view change. Section 3.8 allows exactly
// ONE alive; carrying a hall arrow into a room would mean either two in flight
// or a projectile at hall coordinates on a different map. Clearing it also
// stops the transition being used to bank a shot.
function clearArrowOnViewChange(state) {
  state.floor.arrow.alive = false;
  state.floor.arrow.pending = false;
}

function beginRoomZoomIn(state, door) {
  clearArrowOnViewChange(state);
  state.pendingRoomId = door.id;
  state.pendingDoor = door;
  state.floorReturn = { x: state.floor.player.x, y: state.floor.player.y };
  state.zoomTicks = 0;
  transitionPhase(state, GAME_PHASES.ROOM_ZOOM_IN);
}

function enterRoom(state) {
  const roomId = state.pendingRoomId;
  // An unlooted room that was already entered this life keeps its state; a
  // fresh one is built. Section 4.1's death handling resets unlooted rooms.
  if (!state.floor.rooms[roomId]) {
    const def = ROOM_DEFS[roomId];
    const entryDoor = def.doors[0];
    state.floor.rooms[roomId] = createRoomRuntime(roomId, entryDoor, state.rng);
  }
  state.room = state.floor.rooms[roomId];
  const pos = roomEntryPosition(state.room.def, state.room.entryDoor);
  state.floor.player.x = pos.x;
  state.floor.player.y = pos.y;
  state.floor.player.prevX = pos.x;
  state.floor.player.prevY = pos.y;
  transitionPhase(state, GAME_PHASES.ROOM_VIEW);
}

function beginRoomZoomOut(state) {
  clearArrowOnViewChange(state);
  state.zoomTicks = 0;
  transitionPhase(state, GAME_PHASES.ROOM_ZOOM_OUT);
}

function leaveRoom(state) {
  // Section 2.4: treasure taken -> room PERMANENTLY sealed.
  if (state.room && state.room.treasureTaken) {
    state.floor.looted[state.room.id] = true;
    state.score += state.floor.descriptor.treasureValue;
  }
  state.room = null;
  // Back to the floor door PIP came in by, nudged clear so he does not
  // immediately re-trigger the zoom.
  const back = state.floorReturn;
  const door = state.pendingDoor;
  const size = TUNING.player.hitboxFloor;
  if (door && door.side) {
    const out = door.side === 'N' ? { dx: 0, dy: -1 } : { dx: 0, dy: 1 };
    state.floor.player.x = (door.tx + out.dx) * TUNING.tile + (TUNING.tile - size) / 2;
    state.floor.player.y = (door.ty + out.dy) * TUNING.tile + (TUNING.tile - size) / 2;
  } else if (back) {
    state.floor.player.x = back.x;
    state.floor.player.y = back.y;
  }
  state.floor.player.prevX = state.floor.player.x;
  state.floor.player.prevY = state.floor.player.y;
  state.pendingRoomId = null;
  state.pendingDoor = null;
  transitionPhase(state, GAME_PHASES.FLOOR_VIEW);
}

// SPEC 4.1 death handling. M2 implements the parts that exist.
//
// THE TIMER IS NOT TOUCHED HERE. Resetting or reducing it is a suicide-farm
// exploit (TUNING.flags.DEATH_RESETS_FLOOR_TIMER must stay false).
//
// M5 adds: clear all corpses on the floor, reset unlooted rooms to entry spawn
// state, keep looted rooms looted. Those hooks do not exist yet because
// corpses and rooms do not. The marker below is where they go.
function applyPlayerDeath(state) {
  const player = state.floor.player;
  player.lives--;

  // SECTION 4.1, and the reason it exists. Skipping either half of this
  // softlocks the run: a corpse decaying in the ONLY doorway of an unlooted
  // room makes the stairs permanently unreachable.
  //
  // CLEAR ALL CORPSES on the floor, and RESET every UNLOOTED room to its entry
  // spawn state. LOOTED ROOMS STAY LOOTED and are never rebuilt.
  for (const roomId of Object.keys(state.floor.rooms)) {
    if (state.floor.looted[roomId]) continue;
    resetUnlootedRoom(state.floor.rooms[roomId]);
  }
  // A room in progress is abandoned; PIP respawns at the floor entrance.
  state.room = null;
  state.pendingRoomId = null;
  state.pendingDoor = null;

  // Deliberately NOT here, ever: any write to state.floor.elapsedTicks.
  // TUNING.flags.DEATH_RESETS_FLOOR_TIMER must stay false - true is a
  // suicide-farm exploit.

  state.deathFreezeTicks = Math.round(TUNING.player.deathFreezeSec / TUNING.dt);
  transitionPhase(state, GAME_PHASES.PLAYER_DEATH);
}

// SPEC 12.1.1 - the determinism hash. tests/determinism.mjs imports THIS
// rather than reimplementing it, so test and implementation cannot drift.
//
// Included: anything whose omission could hide a divergence that changes what
// happens in the game. Excluded: render interpolation, audio, cosmetics.
function hashGameState(state) {
  const nums = [];
  nums.push(state.rng.getState(), state.tick, phaseCode(state.phase));
  // deathFreezeTicks gates WHEN respawn fires. Harmless to omit today because
  // respawn writes fixed values, but M5 makes the result of respawn depend on
  // floor state, so include it now rather than remember to later.
  nums.push(state.deathFreezeTicks);

  const floor = state.floor;
  nums.push(floor.elapsedTicks, floor.descriptor.floorIndex);

  const p = floor.player;
  nums.push(p.x, p.y, p.facing, p.lives, p.invulnTicks);

  const a = floor.arrow;
  nums.push(a.alive ? 1 : 0, a.x, a.y, a.dir, a.windup, a.pending ? 1 : 0, a.id);

  // Corner-clipping state changes where a WARDEN goes next, so omitting it
  // could hide a divergence (section 12.1.1 inclusion test).
  //
  // Routed through ONE helper deliberately. The room intruder is the same
  // entity shape driven by the same updateWarden, and hashing it inline meant
  // it silently got 2 of these 11 fields while patrol WARDENs got all 11. Two
  // hand-maintained copies of an entity's hash is how that happens; there is
  // now only one.
  for (const w of floor.wardens) pushWardenState(nums, w);

  // Room looted flags, in a stable order.
  for (const room of floor.layout.rooms) nums.push(floor.looted[room.id] ? 1 : 0);

  // Live room state. Everything here steers what happens next: monster
  // positions, corpse decay phases (a corpse is lethal terrain until it
  // vanishes), the in-room arrow, and whether a WARDEN has intruded.
  nums.push(state.zoomTicks, state.room ? 1 : 0);
  for (const room of floor.layout.rooms) {
    const r = floor.rooms[room.id];
    if (!r) { nums.push(0); continue; }
    nums.push(1, r.treasureTaken ? 1 : 0, r.intruder ? 1 : 0);
    for (const m of r.monsters) {
      nums.push(m.x, m.y, m.dir, m.hp, m.alive ? 1 : 0, m.dodgedArrowId);
    }
    for (const c of r.corpses) nums.push(c.tx, c.ty, c.phase, c.phaseTicks);
    // No per-room arrow to hash: there is one arrow and it is hashed above
    // with the rest of the floor state.
    if (r.intruder) pushWardenState(nums, r.intruder);
  }

  nums.push(state.score);
  // NOT included: prevX/prevY (render interpolation only), phaseTicks where it
  // is cosmetic, and anything derived rather than stored.
  return hashValues(0, nums);
}

// THE one place a WARDEN's hashable state is enumerated. Every WARDEN - patrol
// or room intruder - goes through here, so a field added to one is added to all.
function pushWardenState(nums, w) {
  nums.push(w.x, w.y, w.routeIdx,
    w.checkTicks, w.minX, w.maxX, w.minY, w.maxY,
    w.slideTicks, w.slideAxis, w.slideSign);
}

const PHASE_ORDER = Object.keys(GAME_PHASES);

function phaseCode(phase) {
  const i = PHASE_ORDER.indexOf(phase);
  return i < 0 ? PHASE_ORDER.length : i;
}

function gameElapsedSec(state) {
  return floorElapsedSec(state.floor);
}

// ---- core/gfx.js ----
// VAULT RAIDER - canvas primitives. SPEC v0.6 sections 1, 17.6.
//
// Owns: canvas init, viewport maths, scaling, letter/pillarboxing, and drawing
// primitives. Owns NOTHING about what a floor or a room looks like - scene
// composition is game/render.js (section 13).
//
// computeViewport is pure and DOM-free so it can be tested headless; every
// other function here takes an initialised gfx object and touches the canvas.


// Pure. Logical 320x240 into a CSS-pixel box.
//
// Desktop uses integer scaling so nearest-neighbour upscaling stays crisp.
// allowFractional exists for mobile (section 17.6): integer-only scaling wastes
// too much of a phone screen. Nearest-neighbour still applies either way.
function computeViewport(cssW, cssH, allowFractional) {
  const raw = Math.min(cssW / TUNING.logicalW, cssH / TUNING.logicalH);
  let scale = allowFractional ? raw : Math.floor(raw);
  if (scale < 1) scale = allowFractional ? Math.max(raw, 0) : 1;

  const width = TUNING.logicalW * scale;
  const height = TUNING.logicalH * scale;
  return {
    scale,
    width,
    height,
    // Floored so the blit lands on whole device pixels.
    offsetX: Math.floor((cssW - width) / 2),
    offsetY: Math.floor((cssH - height) / 2)
  };
}

function initGfx(canvas, allowFractional) {
  const ctx = canvas.getContext('2d', { alpha: false });
  const gfx = {
    canvas,
    ctx,
    allowFractional: !!allowFractional,
    viewport: { scale: 1, width: TUNING.logicalW, height: TUNING.logicalH, offsetX: 0, offsetY: 0 },
    dpr: 1
  };
  return gfx;
}

function resizeGfx(gfx, cssW, cssH, devicePixelRatio) {
  const dpr = devicePixelRatio || 1;
  const viewport = computeViewport(cssW, cssH, gfx.allowFractional);

  gfx.dpr = dpr;
  gfx.viewport = viewport;
  gfx.canvas.width = Math.round(viewport.width * dpr);
  gfx.canvas.height = Math.round(viewport.height * dpr);
  gfx.canvas.style.width = viewport.width + 'px';
  gfx.canvas.style.height = viewport.height + 'px';

  // Set after every resize: assigning to canvas.width resets all context state.
  gfx.ctx.imageSmoothingEnabled = false;
  return viewport;
}

function gfxBeginFrame(gfx, clearColor) {
  const { ctx } = gfx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = clearColor;
  ctx.fillRect(0, 0, gfx.canvas.width, gfx.canvas.height);
  // Everything after this point draws in logical 320x240 coordinates.
  const s = gfx.viewport.scale * gfx.dpr;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}

function gfxFillRect(gfx, x, y, w, h, color) {
  gfx.ctx.fillStyle = color;
  gfx.ctx.fillRect(x, y, w, h);
}

function gfxStrokeRect(gfx, x, y, w, h, color, lineWidth) {
  gfx.ctx.strokeStyle = color;
  gfx.ctx.lineWidth = lineWidth;
  gfx.ctx.strokeRect(x, y, w, h);
}

// Debug text only. Shipped HUD text renders from the sprite atlas at M8;
// canvas fillText is here so M1 has something legible to validate against.
function gfxDrawDebugText(gfx, text, x, y, color, sizePx) {
  gfx.ctx.fillStyle = color;
  gfx.ctx.font = sizePx + 'px monospace';
  gfx.ctx.textBaseline = 'top';
  gfx.ctx.fillText(text, x, y);
}

function gfxEndFrame(gfx) {
  gfx.ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- core/audio.js ----
// VAULT RAIDER - procedural audio. SPEC v0.8 sections 10, 11, 14.
//
// M3 SCOPE IS THE INTRUSION SIREN ONLY. Section 14's M3 row asks for "floor
// timer + intrusion + siren"; the full cue set is M9. The dispatch shape below
// exists so M9 adds cues rather than rewriting this, but no other cue is wired.
//
// AudioContext is created LAZILY ON THE FIRST USER GESTURE, never at load
// (section 10) - browser autoplay policy otherwise leaves the game silent with
// no error at all.
//
// Section 11 forbids audio-only information: the siren has a matching on-screen
// indicator in render.js. This module must never be the sole carrier of a fact
// the player needs.
//
// No DOM or AudioContext access at import time. Safe to import from tests/.


function createAudio() {
  return {
    ctx: null,
    master: null,
    muted: false,
    started: false,
    sirenOsc: null,
    sirenGain: null
  };
}

// Call from a real user gesture (keydown, pointerdown). Idempotent.
function initAudioOnGesture(audio, win) {
  if (audio.started) return audio;
  const Ctor = win.AudioContext || win.webkitAudioContext;
  if (!Ctor) return audio;
  try {
    audio.ctx = new Ctor();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = TUNING.a11y.masterVolume;
    audio.master.connect(audio.ctx.destination);
    audio.started = true;
  } catch (err) {
    // A blocked or unavailable AudioContext must never break the game.
    audio.ctx = null;
    audio.started = false;
  }
  return audio;
}

function setMasterVolume(audio, value) {
  if (audio.master) audio.master.gain.value = value;
}

function muteAudio(audio, on) {
  audio.muted = !!on;
  if (audio.master) {
    audio.master.gain.value = on ? 0 : TUNING.a11y.masterVolume;
  }
}

// Section 10: rising siren, begins intrusionWarnSec before the WARDEN enters,
// "must be unmistakable". level runs 0..1 as the deadline approaches.
function setSirenLevel(audio, level) {
  if (!audio.started || !audio.ctx || audio.muted) return;

  if (level <= 0) {
    if (audio.sirenOsc) {
      audio.sirenGain.gain.setTargetAtTime(0, audio.ctx.currentTime, AUDIO.sirenRampSec);
      audio.sirenOsc.stop(audio.ctx.currentTime + AUDIO.sirenRampSec * 4);
      audio.sirenOsc = null;
      audio.sirenGain = null;
    }
    return;
  }

  if (!audio.sirenOsc) {
    audio.sirenOsc = audio.ctx.createOscillator();
    audio.sirenOsc.type = 'sawtooth';
    audio.sirenGain = audio.ctx.createGain();
    audio.sirenGain.gain.value = 0;
    audio.sirenOsc.connect(audio.sirenGain);
    audio.sirenGain.connect(audio.master);
    audio.sirenOsc.start();
  }
  const hz = AUDIO.sirenBaseHz + (AUDIO.sirenPeakHz - AUDIO.sirenBaseHz) * level;
  audio.sirenOsc.frequency.setTargetAtTime(hz, audio.ctx.currentTime, AUDIO.sirenRampSec);
  audio.sirenGain.gain.setTargetAtTime(AUDIO.sirenGain * level, audio.ctx.currentTime, AUDIO.sirenRampSec);
}

function stopAllAudio(audio) {
  setSirenLevel(audio, 0);
}

// ---- game/render.js ----
// VAULT RAIDER - scene composition. SPEC v0.7 sections 2, 13, 17.6.
//
// Owns WHAT the scene looks like. core/gfx.js owns HOW pixels get to the
// canvas (init, scaling, viewport, blit). Neither is imported by tests/.
//
// Sprites arrive at M3; M2 renders with primitives.


// Palette. Per-floor palette swapping arrives with the sprite atlas at M3.
const PAL_VOID = '#05050a';
const PAL_WALL = '#2a2a44';
const PAL_WALL_TOP = '#3c3c60';
const PAL_FLOOR = '#12121e';
const PAL_ROOM = '#1e1a2e';
const PAL_DOOR = '#c8a020';
const PAL_STAIRS = '#40c880';
const PAL_PIP = '#f8f0c0';
const PAL_FACING = '#e04030';
const PAL_ARROW = '#f8f0c0';
const PAL_WARDEN = '#d02040';
const PAL_WARDEN_EYE = '#f8f0c0';
const PAL_HUD = '#8090b0';
const PAL_MONSTER = '#40b060';
const PAL_MONSTER_EDGE = '#a8f0c0';
const PAL_CORPSE = '#785060';
const PAL_CORPSE_HATCH = '#c8a0b0';
const PAL_TREASURE = '#f0c840';
const PAL_SAFE = '#2a4a3a';
const PAL_WARN = '#e04030';

const HUD_TEXT_PX = 6;
const HUD_MARGIN = 3;
const FACING_PIP_PX = 2;
const FACING_PIP_DIST = 5;

// DERIVED from the a11y flash cap, never hardcoded (section 11: nothing in the
// game may flash above maxFlashHz). A literal 4 here was a 7.5 Hz blink - over
// the cap, and the cap already existed in tuning.js unconsulted. One full
// on/off cycle spans two of these, hence the 2.
const INVULN_BLINK_TICKS = Math.ceil(1 / (TUNING.a11y.maxFlashHz * 2 * TUNING.dt));

function lerp(a, b, t) { return a + (b - a) * t; }

function renderFrame(gfx, state, alpha) {
  gfxBeginFrame(gfx, PAL_VOID);
  switch (state.phase) {
    case GAME_PHASES.ROOM_VIEW:
      renderRoomView(gfx, state, alpha);
      break;
    case GAME_PHASES.ROOM_ZOOM_IN:
    case GAME_PHASES.ROOM_ZOOM_OUT:
      renderZoom(gfx, state, alpha);
      break;
    default:
      renderFloorView(gfx, state, alpha);
      break;
  }
  renderHud(gfx, state);
  gfxEndFrame(gfx);
}

// Section 8: 24-tick scale-lerp of the room rect to full screen. Duration is in
// TICKS, never ms. Non-interactive, and the floor clock keeps running.
function renderZoom(gfx, state, alpha) {
  const t = Math.min(1, (state.zoomTicks + alpha) / TUNING.zoom.durationTicks);
  const grow = state.phase === GAME_PHASES.ROOM_ZOOM_IN ? t : 1 - t;
  renderFloorView(gfx, state, alpha);
  // Iris: a growing dark frame closing over the floor, so the transition reads
  // as travel rather than a hard cut. Luminance changes gradually - section 11
  // caps full-screen luminance change per frame under reducedFlash.
  const inset = Math.round((1 - grow) * TUNING.logicalW / 2);
  const w = TUNING.logicalW;
  const h = TUNING.logicalH;
  gfxFillRect(gfx, 0, 0, w, Math.max(0, h / 2 - inset * h / w), PAL_VOID);
  gfxFillRect(gfx, 0, h - Math.max(0, h / 2 - inset * h / w), w, Math.max(0, h / 2 - inset * h / w), PAL_VOID);
  gfxFillRect(gfx, 0, 0, Math.max(0, w / 2 - inset), h, PAL_VOID);
  gfxFillRect(gfx, w - Math.max(0, w / 2 - inset), 0, Math.max(0, w / 2 - inset), h, PAL_VOID);
}

function renderRoomView(gfx, state, alpha) {
  const room = state.room;
  const t = TUNING.tile;

  for (let ty = 0; ty < room.tiles.length; ty++) {
    const row = room.tiles[ty];
    for (let tx = 0; tx < row.length; tx++) {
      if (row[tx] === '.') {
        gfxFillRect(gfx, tx * t, ty * t, t, t, PAL_FLOOR);
      } else {
        const openAbove = ty > 0 && room.tiles[ty - 1][tx] === '.';
        gfxFillRect(gfx, tx * t, ty * t, t, t, openAbove ? PAL_WALL_TOP : PAL_WALL);
      }
    }
  }

  for (const door of room.def.doors) {
    gfxFillRect(gfx, door.tx * t, door.ty * t, t, t, PAL_DOOR);
  }

  // Treasure and its safe tile. Section 3.7 - standing here makes PIP
  // unkillable, so the tile is drawn distinctly rather than left implicit.
  if (!room.treasureTaken) {
    const tr = room.def.treasure;
    if (tr.safeTile) gfxFillRect(gfx, tr.tx * t, tr.ty * t, t, t, PAL_SAFE);
    gfxFillRect(gfx, tr.tx * t + 1, tr.ty * t + 2, t - 2, t - 4, PAL_TREASURE);
    gfxFillRect(gfx, tr.tx * t + 2, tr.ty * t + t - 3, t - 4, 2, PAL_TREASURE);
  }

  // Corpses. Section 11: lethality must NEVER be conveyed by hue alone, so
  // every decay phase carries a diagonal hatch and a broken silhouette.
  for (const corpse of room.corpses) {
    const cx = corpse.tx * t;
    const cy = corpse.ty * t;
    // Section 11: lethality must NEVER be conveyed by hue alone, at EVERY decay
    // phase - and the last phase is when a mistake costs most.
    //
    // Two arithmetic mistakes were made here before this shape survived. A
    // fixed 2px diagonal stride left ONE hatch pixel at the final phase. Then
    // scaling the stride to the span still left only TWO, because letting the
    // box shrink by a pixel per phase makes it 2x2 by phase 3 and a 2x2 box
    // cannot hold three diagonal marks - the geometry, not the stride, was the
    // limit. Counts are asserted in tests/rooms.mjs rather than claimed here.
    const shrink = Math.min(corpse.phase, TUNING.corpse.decayPhases - 2);
    const span = t - shrink * 2;
    gfxFillRect(gfx, cx + shrink, cy + shrink, span, span, PAL_CORPSE);

    const stride = Math.max(1, Math.floor(span / 3));
    for (let i = 0; i < span; i += stride) {
      gfxFillRect(gfx, cx + shrink + i, cy + shrink + (span - 1 - i), 1, 1, PAL_CORPSE_HATCH);
    }
    // The last phase shares a size with the one before it, so it needs a
    // different SHAPE to stay a "distinct broken silhouette": the second
    // diagonal turns the hatch into an X.
    if (corpse.phase >= TUNING.corpse.decayPhases - 1) {
      for (let i = 0; i < span; i += stride) {
        gfxFillRect(gfx, cx + shrink + i, cy + shrink + i, 1, 1, PAL_CORPSE_HATCH);
      }
    }
  }

  for (const monster of room.monsters) {
    if (!monster.alive) continue;
    const mx = Math.round(lerp(monster.prevX, monster.x, alpha));
    const my = Math.round(lerp(monster.prevY, monster.y, alpha));
    const s = TUNING.monster.hurtbox;
    gfxFillRect(gfx, mx, my, s, s, PAL_MONSTER);
    // Distinct silhouette from PIP at 1x, greyscale-safe (section 11).
    gfxFillRect(gfx, mx, my + s - 2, s, 2, PAL_MONSTER_EDGE);
    gfxFillRect(gfx, mx + 1, my + 1, 2, 2, PAL_MONSTER_EDGE);
  }

  // The ONE arrow, owned by the floor runtime (section 3.8).
  const roomArrow = state.floor.arrow;
  if (roomArrow.alive) {
    gfxFillRect(gfx,
      Math.round(lerp(roomArrow.prevX, roomArrow.x, alpha)) - 1,
      Math.round(lerp(roomArrow.prevY, roomArrow.y, alpha)) - 1, 2, 2, PAL_ARROW);
  }

  if (room.intruder) {
    const w = room.intruder;
    const wx = Math.round(lerp(w.prevX, w.x, alpha));
    const wy = Math.round(lerp(w.prevY, w.y, alpha));
    const s = TUNING.warden.hurtbox;
    gfxFillRect(gfx, wx, wy, s, s, PAL_WARDEN);
    gfxFillRect(gfx, wx + 2, wy + 2, 2, 2, PAL_WARDEN_EYE);
    gfxFillRect(gfx, wx + s - 4, wy + 2, 2, 2, PAL_WARDEN_EYE);
  }

  renderPip(gfx, state, alpha, TUNING.player.hitboxRoom,
    playerOnSafeTile(room, state.floor.player));
}

function renderFloorView(gfx, state, alpha) {
  const floor = state.floor;
  const t = TUNING.tile;

  // Mask. Wall tops get a lighter edge so corridors read as corridors at 1x.
  for (let ty = 0; ty < floor.mask.length; ty++) {
    const row = floor.mask[ty];
    for (let tx = 0; tx < row.length; tx++) {
      if (row[tx] === '.') {
        gfxFillRect(gfx, tx * t, ty * t, t, t, PAL_FLOOR);
      } else {
        const openAbove = ty > 0 && floor.mask[ty - 1][tx] === '.';
        gfxFillRect(gfx, tx * t, ty * t, t, t, openAbove ? PAL_WALL_TOP : PAL_WALL);
      }
    }
  }

  // Room blocks and their doors.
  for (const room of floor.layout.rooms) {
    const [rx, ry, rw, rh] = room.rect;
    gfxFillRect(gfx, rx * t, ry * t, rw * t, rh * t, PAL_ROOM);
    gfxFillRect(gfx, room.door.tx * t, room.door.ty * t, t, t,
      floor.looted[room.id] ? PAL_WALL : PAL_DOOR);
  }

  // Stairs.
  const st = floor.layout.stairs;
  gfxFillRect(gfx, st.tx * t + 1, st.ty * t + 1, t - 2, t - 2, PAL_STAIRS);

  // Arrow. Real and useless in the hall (section 3.2) - drawn so the player
  // can see it pass straight through a WARDEN.
  const arrow = floor.arrow;
  if (arrow.alive) {
    gfxFillRect(gfx,
      Math.round(lerp(arrow.prevX, arrow.x, alpha)) - 1,
      Math.round(lerp(arrow.prevY, arrow.y, alpha)) - 1, 2, 2, PAL_ARROW);
  }

  // WARDENs.
  for (const w of floor.wardens) {
    const wx = Math.round(lerp(w.prevX, w.x, alpha));
    const wy = Math.round(lerp(w.prevY, w.y, alpha));
    const s = TUNING.warden.hurtbox;
    gfxFillRect(gfx, wx, wy, s, s, PAL_WARDEN);
    // Distinct silhouette, not hue alone (section 11 contrast requirement).
    gfxFillRect(gfx, wx + 2, wy + 2, 2, 2, PAL_WARDEN_EYE);
    gfxFillRect(gfx, wx + s - 4, wy + 2, 2, 2, PAL_WARDEN_EYE);
  }

  renderPip(gfx, state, alpha, TUNING.player.hitboxFloor, false);
}

function renderPip(gfx, state, alpha, size, safe) {
  const p = state.floor.player;
  const blinking = p.invulnTicks > 0 &&
    Math.floor(p.invulnTicks / INVULN_BLINK_TICKS) % 2 === 0;
  if (state.phase === GAME_PHASES.GAME_OVER || blinking) return;

  const px = Math.round(lerp(p.prevX, p.x, alpha));
  const py = Math.round(lerp(p.prevY, p.y, alpha));
  gfxFillRect(gfx, px, py, size, size, PAL_PIP);
  // A ring while standing on the safe tile, so invulnerability is visible
  // rather than something the player has to infer (section 11).
  if (safe) {
    gfxStrokeRect(gfx, px - 1.5, py - 1.5, size + 3, size + 3, PAL_TREASURE, 1);
  }
  // Facing indicator. Persists with no keys held - section 17.1.1 made visible,
  // and the fastest way to spot a regression by eye.
  const d = DIRS[p.facing];
  gfxFillRect(gfx,
    Math.round(px + size / 2 + d.dx * FACING_PIP_DIST - FACING_PIP_PX / 2),
    Math.round(py + size / 2 + d.dy * FACING_PIP_DIST - FACING_PIP_PX / 2),
    FACING_PIP_PX, FACING_PIP_PX, PAL_FACING);
}

function renderHud(gfx, state) {
  // Section 17.6: HUD pins to the TOP edge. Never the bottom corners - thumbs
  // cover them on a phone.
  const floor = state.floor;
  const elapsed = floorElapsedSec(floor);
  const limit = floor.descriptor.floorTimerSec;
  const left = Math.max(0, limit - elapsed);

  const line = 'FLOOR ' + (floor.descriptor.floorIndex + 1) +
    '   LIVES ' + floor.player.lives +
    '   SCORE ' + state.score +
    '   CLOCK ' + left.toFixed(1);
  gfxDrawDebugText(gfx, line, HUD_MARGIN, HUD_MARGIN, PAL_HUD, HUD_TEXT_PX);

  // SECTION 11: NO AUDIO-ONLY INFORMATION. The intrusion siren must have a
  // matching persistent on-screen indicator - border pulse plus countdown pips
  // - so a muted or deaf player gets the same warning at the same moment.
  const warn = intrusionWarningLevel(floor.descriptor, elapsed);
  if (warn > 0) {
    // Steady ramp, not a strobe. Nothing may flash above a11y.maxFlashHz.
    const inset = 0;
    gfxStrokeRect(gfx, inset, inset,
      TUNING.logicalW - inset * 2, TUNING.logicalH - inset * 2, PAL_WARN, 1 + Math.round(warn * 2));
    // Countdown pips: one per remaining warning second, top-centre.
    const pips = Math.ceil((1 - warn) * TUNING.warden.intrusionWarnSec);
    for (let i = 0; i < pips; i++) {
      gfxFillRect(gfx, TUNING.logicalW / 2 - 10 + i * 5, HUD_MARGIN + 8, 3, 3, PAL_WARN);
    }
  }
  if (state.room && state.room.intruder) {
    gfxDrawDebugText(gfx, 'WARDEN IN ROOM',
      TUNING.logicalW / 2 - 42, HUD_MARGIN + 8, PAL_WARN, HUD_TEXT_PX);
  }

  if (state.phase === GAME_PHASES.GAME_OVER) {
    gfxDrawDebugText(gfx, 'GAME OVER',
      TUNING.logicalW / 2 - 24, TUNING.logicalH / 2 - 4, PAL_PIP, HUD_TEXT_PX * 2);
  }
}

// ---- main.js ----
// VAULT RAIDER - boot and wiring. SPEC v0.7 section 14.
//
// Wiring only. No game logic lives here, and no constants either - the M1
// debug scaffolding and its module-local palette are gone as of M2.


// Fixed boot seed. Deterministic across reloads, which is what makes a
// recorded input stream replayable (section 12.1.2). A per-run seed arrives
// with the high-score table at M9.
const BOOT_SEED = 0x5641554c;

function bootVaultRaider(doc, win) {
  const canvas = doc.getElementById('vr-canvas');
  const gfx = initGfx(canvas, false);

  const hub = createInputHub();
  bindKeyboardInput(hub, win, win, doc);

  // Every session records its input stream. Determinism is a v1 requirement
  // (section 15), so the recorder runs from M1 rather than being retrofitted.
  const recorder = createInputRecorder();
  const state = createGameState(BOOT_SEED, 0);

  // Section 10: AudioContext is created lazily on the FIRST USER GESTURE, never
  // at load. Browser autoplay policy otherwise leaves the game silent with no
  // error to explain it.
  const audio = createAudio();
  const wake = () => initAudioOnGesture(audio, win);
  win.addEventListener('keydown', wake, { once: true });
  win.addEventListener('pointerdown', wake, { once: true });

  function fitCanvas() {
    resizeGfx(gfx, win.innerWidth, win.innerHeight, win.devicePixelRatio);
  }
  fitCanvas();
  win.addEventListener('resize', fitCanvas);

  const loop = createLoop({
    // performance.now() is milliseconds; the loop works in seconds. This is a
    // unit conversion, not a tuning value, so it stays inline.
    now: () => win.performance.now() / 1000,
    schedule: (cb) => win.requestAnimationFrame(cb),
    update: () => {
      // sampleInput is called EXACTLY once per tick. It advances edge detection.
      const input = sampleInput(hub);
      recordInputFrame(recorder, input);
      updateGame(state, input);
      // The siren is driven from the same value the on-screen indicator uses,
      // so sound and picture can never disagree (section 11).
      setSirenLevel(audio,
        intrusionWarningLevel(state.floor.descriptor, floorElapsedSec(state.floor)));
    },
    render: (alpha) => renderFrame(gfx, state, alpha)
  });

  loop.start();
  return { loop, hub, gfx, state, recorder, audio };
}

// Guarded so importing main.js under Node (build checks, tooling) does not
// touch the DOM.
if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  bootVaultRaider(document, window);
}
</script>
