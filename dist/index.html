<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VAULT RAIDER</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="An original arcade dungeon crawler inspired by early-1980s coin-op games.">
<meta name="color-scheme" content="dark">
<style>
/* VAULT RAIDER - shell styling. SPEC v0.6 sections 1, 9, 17.6.
   The canvas is the game. Everything here exists to letterbox it and to stop
   the browser doing anything helpful with touch input. */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  /* 100dvh, not 100vh: iOS Safari's dynamic toolbar makes vh lie (17.6). */
  height: 100dvh;
  background: #000;
  overflow: hidden;
  /* Suppress pull-to-refresh and rubber-banding. */
  overscroll-behavior: none;
  /* section 9 / 17.6: no scroll, no pinch zoom, no double-tap zoom. */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;   /* no long-press context menu on iOS */
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  /* Respect the notch and the home indicator (17.6). */
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#vr-canvas {
  display: block;
  /* Nearest-neighbour at every scale. Integer scaling is enforced in
     computeViewport; this stops the browser resampling on top of it. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  background: #000;
}

</style>
</head>
<body>
<canvas id="vr-canvas" width="320" height="240"></canvas>
<script type="module">
// ---- data/tuning.js ----
// VAULT RAIDER - tuning constants. SPEC v0.6 section 6.
//
// THE ONLY PLACE CONSTANTS LIVE. No logic file may carry a magic number.
// Values here are transcribed from SPEC section 6; where SPEC states a value
// only in prose the source section is named in a comment.
//
// No DOM access. Safe to import from tests/.

const TUNING = {
  tile: 8, gridW: 40, gridH: 30,          // 320x240
  logicalW: 320, logicalH: 240, dt: 1 / 60,
  maxSubsteps: 5, maxFrameSec: 0.25,

    spriteFloor: 4, spriteRoom: 12,       // [v0.7] section 4.1, was prose-only
    snapAssistWindowPx: 2,                // section 4.1 doorway snap-assist
    snapAssistStepPx: 1,                  // section 4.1

  monster: {

  zoom: { durationTicks: 24 },            // section 8 - ticks, never ms

  // section 9. Consumed at M10; here now so M10 cannot hardcode it inline.
  gamepad: { stickDeadzone: 0.35 },

  touch: {                                // section 17.2 - 17.6, device px
    knobDiameterDevicePx: 64,
    maxRadiusDevicePx: 40,

    fadeOutTicks: 8,
    sectorWidthDeg: 45,
    hysteresisDeg: 8,
    tapMaxTicks: 10,

  },

  // Per-FLOOR intrusion clock. Never resets on room exit or on death.
  warden: {

    speedMul: [0.85, 0.95, 1.05], pursuitBiasRate: 0.02,
    pursuitBiasCap: 0.9,                  // [v0.7] section 4.3, was prose-only
    countByLayout: [2, 3, 4],
    hurtbox: 8                            // section 4.1, 4.3 - no collision box
  },

  },

  dodgeSkill: { LOW: 0.15, MED: 0.45, HIGH: 0.80 },

  scoring: {
    monsterKill: {

      STALKER: 250, BRUTE: 300, BLINKER: 400
    },
    treasureByFloor: [400, 600, 800],
    floorClearBase: 1000,
    // [v0.7] The two terms of the section 6 bonus formula, previously inline

    floorClearMultBase: 1,
    floorClearMultRange: 4,
    extraLifeEvery: 20000
  },

  flags: {
    HALL_FIRE_ENABLED: true,
    CORPSE_SHOT_MODE: 'RESET_ONE',   // | 'RESET_ALL' - CONTESTED, decide by playtest
    DEATH_RESETS_FLOOR_TIMER: false, // must stay false; true is an exploit
    DEATH_CLEARS_CORPSES: true       // must stay true; false softlocks the run
  },

  a11y: {
    reducedFlash: false, colorblindCorpses: true, masterVolume: 0.7,
    maxLuminanceStepPerFrame: 0.10,       // section 11
    maxFlashHz: 3                         // section 11
  },

  // Floor indexing, SPEC section 2.1. Floor 10+ replays floor 9.
  maxFloorIndex: 8,
  layoutCount: 3
};

// ---------------------------------------------------------------------------
// SCHEDULER CONSTANTS - deliberately NOT part of TUNING.
//
// NOT TRANSCRIBED FROM SPEC. This is the one invented number in the project.
//
// It is segregated here because it is a SCHEDULER constant, not a SIMULATION
// constant, and that distinction is what makes it safe:
//
//   update() always receives a fixed DT. Wall-clock jitter changes WHEN a tick
//   fires, never WHAT happens inside one. Determinism is therefore unaffected -
//   but only while that separation holds.
//
// NO CODE REACHABLE FROM update() MAY READ THIS. If a game rule ever depends on
// it, the scheduler has entered the simulation and the approval is void.
// Only src/core/loop.js may import it.
//
// Cause: IEEE-754. A refresh rate whose frame time does not divide cleanly into
// one second leaves the accumulator a few ulps short of a whole step, so the
// loop runs a permanent one tick behind. 144 Hz is the case that bites - 144
// additions of 1/144 sum to just under 1.0, so the 60th update of every second
// slips a frame, forever (59, 119, 179 ...). A constant phase offset, not
// compounding drift. Far smaller than a tick, far larger than float noise.
//
// See docs/NOTES.md A7. Covered by tests/loop.mjs.
const SCHEDULER = { accumulatorEpsilonSec: 1e-9 };

// 8-way direction sectors. Index 0..7, clockwise from North.
// Screen space: -y is North. DIR_NEUTRAL is -1.
const DIR_NEUTRAL = -1;
const DIR_COUNT = 8;

// Diagonals are normalised so all 8 directions move at the same speed.
// SPEC gives speed as a single px/tick scalar, which only holds if diagonals
// are normalised - see docs/NOTES.md A6.
const DIAG_UNIT = Math.SQRT1_2;

const DIRS = [
  { dx: 0, dy: -1, name: 'N', diagonal: false },
  { dx: DIAG_UNIT, dy: -DIAG_UNIT, name: 'NE', diagonal: true },
  { dx: 1, dy: 0, name: 'E', diagonal: false },
  { dx: DIAG_UNIT, dy: DIAG_UNIT, name: 'SE', diagonal: true },
  { dx: 0, dy: 1, name: 'S', diagonal: false },
  { dx: -DIAG_UNIT, dy: DIAG_UNIT, name: 'SW', diagonal: true },
  { dx: -1, dy: 0, name: 'W', diagonal: false },
  { dx: -DIAG_UNIT, dy: -DIAG_UNIT, name: 'NW', diagonal: true }
];

// SPEC section 8 state machine.
const GAME_PHASES = {
  BOOT: 'BOOT',
  ATTRACT: 'ATTRACT',
  INTRO_WALK: 'INTRO_WALK',
  FLOOR_VIEW: 'FLOOR_VIEW',
  ROOM_ZOOM_IN: 'ROOM_ZOOM_IN',
  ROOM_VIEW: 'ROOM_VIEW',
  ROOM_ZOOM_OUT: 'ROOM_ZOOM_OUT',
  STAIRS: 'STAIRS',
  FLOOR_CLEAR_BONUS: 'FLOOR_CLEAR_BONUS',
  PLAYER_DEATH: 'PLAYER_DEATH',
  GAME_OVER: 'GAME_OVER',
  HIGH_SCORE: 'HIGH_SCORE'
};

// SPEC section 4.4.
const ARCHETYPES = {
  CRAWLER: 'CRAWLER', BOUNCER: 'BOUNCER', DROPPER: 'DROPPER',
  STALKER: 'STALKER', BRUTE: 'BRUTE', BLINKER: 'BLINKER'
};

// SPEC sections 7.1 / 7.2 mask characters.
const TILE_CHARS = { WALL: '#', FLOOR: '.' };

// SPEC section 9 keyboard bindings. Device specifics live in the binding layer,
// but the key names themselves are constants and belong here.
const KEY_BINDINGS = {
  up: ['ArrowUp', 'KeyW'],
  down: ['ArrowDown', 'KeyS'],
  left: ['ArrowLeft', 'KeyA'],
  right: ['ArrowRight', 'KeyD'],
  fire: ['Space', 'KeyJ'],
  pause: ['KeyP', 'Escape'],
  mute: ['KeyM']
};

// ---- core/rng.js ----
// VAULT RAIDER - seeded RNG. SPEC v0.6 section 1.
//
// The platform PRNG is BANNED project-wide. tests/determinism.mjs greps src/
// for its name and fails the build on any hit - which is why that name is not
// written out anywhere in this directory, including in comments like this one.
// This file is the only randomness source in the project.
//
// xorshift32: same seed in, same sequence out, on every platform. All ops are
// 32-bit integer ops, so there is no float-rounding divergence to worry about.
//
// No DOM access. Safe to import from tests/.

// xorshift32 has one degenerate state: 0 maps to 0 forever. Any caller passing
// a zero seed gets this instead. Arbitrary non-zero constant.
const RNG_FALLBACK_SEED = 0x9e3779b9;

const RNG_SHIFT_A = 13;
const RNG_SHIFT_B = 17;
const RNG_SHIFT_C = 5;
const RNG_U32_DIVISOR = 4294967296;   // 2^32, converts u32 to [0, 1)

const FNV_OFFSET_BASIS = 0x811c9dc5;
const FNV_PRIME = 0x01000193;

function createRng(seed) {
  let state = (seed >>> 0) || RNG_FALLBACK_SEED;

  function nextU32() {
    let x = state;
    x ^= (x << RNG_SHIFT_A) >>> 0;
    x ^= x >>> RNG_SHIFT_B;
    x ^= (x << RNG_SHIFT_C) >>> 0;
    state = x >>> 0;
    return state;
  }

  return {
    nextU32,
    // [0, 1)
    nextFloat() { return nextU32() / RNG_U32_DIVISOR; },
    // [0, n)
    nextInt(n) { return (nextU32() % n) >>> 0; },
    getState() { return state; },
    setState(s) { state = (s >>> 0) || RNG_FALLBACK_SEED; },
    clone() { return createRng(state); }
  };
}

// FNV-1a 32-bit over a stream of numbers. Used by hashGameState (SPEC 12.1.1).
// Non-integer values are folded through their raw IEEE-754 bits so that a
// sub-pixel position difference cannot hash equal.
function hashValues(seed, nums) {
  const scratch = new DataView(new ArrayBuffer(8));
  let h = (seed >>> 0) || FNV_OFFSET_BASIS;
  for (let i = 0; i < nums.length; i++) {
    const v = nums[i];
    if (Number.isInteger(v)) {
      h = hashU32Into(h, v >>> 0);
    } else {
      scratch.setFloat64(0, v);
      h = hashU32Into(h, scratch.getUint32(0));
      h = hashU32Into(h, scratch.getUint32(4));
    }
  }
  return h >>> 0;
}

function hashU32Into(h, u32) {
  let acc = h >>> 0;
  for (let byte = 0; byte < 4; byte++) {
    acc ^= (u32 >>> (byte * 8)) & 0xff;
    acc = Math.imul(acc, FNV_PRIME) >>> 0;
  }
  return acc >>> 0;
}

// ---- core/input.js ----
// VAULT RAIDER - unified input model. SPEC v0.6 sections 9, 17.1, 17.1.1.
//
// THE ONLY THING GAME LOGIC READS FOR INPUT.
//
// Three sources (keyboard, gamepad, touch), ONE per-tick struct, ONE consumer:
//
//     { dir: 0..7 | -1,          MOVEMENT intent only
//       fire: bool,              EDGE, detected at the source (section 9)
//       facingLatch: 0..7 | -1 } EVENT: a direction was expressed this tick
//
// Two rules that this file exists to enforce, both from section 17.1.1:
//
//   1. facingLatch is an EVENT with a one-tick lifetime. It is NOT state, and
//      must never be read as PIP's current facing. PIP's persistent entity
//      facing lives on the entity and updates only when facingLatch !== -1.
//
//   2. fire is edge-detected HERE, at the source, before the struct is built -
//      for all three sources, not just touch. Keyboard auto-repeat fires
//      keydown continuously while a key is held; a held gamepad button is level
//      too. Edge-detecting downstream in game code would be a second input path
//      and would break section 17.1.
//
// Sources are generic. A source is added by calling registerInputSource and
// then pushing intent through setSourceIntent / setSourceFireHeld. There is no
// per-source branch anywhere in the reduction, which is what makes touch a
// third SOURCE at M11 rather than a second PATH.
//
// No DOM access at import time. The bind* functions touch the DOM only when
// called, and only main.js calls them. Safe to import from tests/.


const INPUT_SOURCE_IDS = { KEYBOARD: 'kbd', GAMEPAD: 'pad', TOUCH: 'touch' };

const INPUT_NEUTRAL_SAMPLE = Object.freeze({
  dir: DIR_NEUTRAL, fire: false, facingLatch: DIR_NEUTRAL
});

// Bit widths for encodeInputFrame. A sector is stored as sector+1 so that
// DIR_NEUTRAL (-1) becomes 0 and the whole frame packs into 9 bits.
const INPUT_SECTOR_BIAS = 1;
const INPUT_SECTOR_MASK = 0xf;
const INPUT_FACING_SHIFT = 4;
const INPUT_FIRE_BIT = 1 << 8;

function createInputHub() {
  return { sources: [], byId: new Map(), tick: 0 };
}

function registerInputSource(hub, id) {
  if (hub.byId.has(id)) return hub.byId.get(id);
  const source = {
    id,
    order: hub.sources.length,
    moveSector: DIR_NEUTRAL,
    faceSector: DIR_NEUTRAL,
    fireHeld: false,
    firePrev: false,
    lastIntentTick: -1
  };
  hub.sources.push(source);
  hub.byId.set(id, source);
  return source;
}

// The generic intent setter. Every source funnels through this.
//
// moveSector: 0..7 to move, DIR_NEUTRAL for none.
// faceSector: 0..7 to express a direction, DIR_NEUTRAL for none.
//
// Keyboard and gamepad pass the same sector for both on a held direction.
// Touch tap-to-reface (section 17.4) passes moveSector = DIR_NEUTRAL with a
// real faceSector - that asymmetry is the whole reason these are two arguments.
function setSourceIntent(hub, id, moveSector, faceSector) {
  const source = hub.byId.get(id);
  if (!source) return;

  // lastIntentTick advances only when the intent CHANGES, never merely because
  // the setter was called again with the same values.
  //
  // This keeps arbitration symmetric between event-driven and polled sources.
  // Keyboard pushes intent on keydown/keyup transitions; gamepad (section 9)
  // must be polled every tick. If a re-poll refreshed the timestamp, a held
  // gamepad direction would out-rank a keyboard direction the player was
  // actively using, purely because one source repeats itself and the other
  // does not. "Most recently active" has to mean most recently CHANGED.
  const changed = moveSector !== source.moveSector || faceSector !== source.faceSector;
  source.moveSector = moveSector;
  source.faceSector = faceSector;

  const hasIntent = moveSector !== DIR_NEUTRAL || faceSector !== DIR_NEUTRAL;
  if (changed && hasIntent) source.lastIntentTick = hub.tick;
}

function setSourceFireHeld(hub, id, held) {
  const source = hub.byId.get(id);
  if (!source) return;
  source.fireHeld = !!held;
}

// pointercancel and visibilitychange must both land here (section 17.6). An
// incoming call that leaves dir latched will kill the player.
function releaseAllInput(hub) {
  for (const source of hub.sources) {
    source.moveSector = DIR_NEUTRAL;
    source.faceSector = DIR_NEUTRAL;
    source.fireHeld = false;
    // firePrev is deliberately NOT cleared. Clearing it would let a button
    // still physically held at the moment focus returns read as a fresh edge.
  }
}

// Reduce all sources to the one struct.
//
// MUST be called exactly once per tick: it advances each source's edge-detection
// state. Calling it twice in a tick silently eats a fire edge.
function sampleInput(hub) {
  let fire = false;
  let winner = null;

  for (const source of hub.sources) {
    // Edge detection, at the source, before the struct is built.
    if (source.fireHeld && !source.firePrev) fire = true;
    source.firePrev = source.fireHeld;

    const hasIntent =
      source.moveSector !== DIR_NEUTRAL || source.faceSector !== DIR_NEUTRAL;
    if (!hasIntent) continue;

    // Most recently active source wins; ties break by registration order so the
    // result is deterministic regardless of Map iteration details.
    if (
      winner === null ||
      source.lastIntentTick > winner.lastIntentTick ||
      (source.lastIntentTick === winner.lastIntentTick && source.order < winner.order)
    ) {
      winner = source;
    }
  }

  hub.tick++;

  if (winner === null) return { dir: DIR_NEUTRAL, fire, facingLatch: DIR_NEUTRAL };
  return { dir: winner.moveSector, fire, facingLatch: winner.faceSector };
}

// Cardinal key bits -> sector. ax and ay are each -1, 0, or 1; ay is screen
// space, so -1 is North. Opposed keys cancel before they reach here.
function cardinalToSector(ax, ay) {
  if (ax === 0 && ay === 0) return DIR_NEUTRAL;
  if (ax === 0) return ay < 0 ? 0 : 4;
  if (ay === 0) return ax > 0 ? 2 : 6;
  if (ax > 0) return ay < 0 ? 1 : 3;
  return ay < 0 ? 7 : 5;
}

// --- replay ---------------------------------------------------------------
// A frame packs into 9 bits, so a recorded stream is a plain array of small
// ints and needs no serialisation format.

function encodeInputFrame(sample) {
  const dir = (sample.dir + INPUT_SECTOR_BIAS) & INPUT_SECTOR_MASK;
  const face = (sample.facingLatch + INPUT_SECTOR_BIAS) & INPUT_SECTOR_MASK;
  return dir | (face << INPUT_FACING_SHIFT) | (sample.fire ? INPUT_FIRE_BIT : 0);
}

function decodeInputFrame(packed) {
  return {
    dir: (packed & INPUT_SECTOR_MASK) - INPUT_SECTOR_BIAS,
    facingLatch: ((packed >> INPUT_FACING_SHIFT) & INPUT_SECTOR_MASK) - INPUT_SECTOR_BIAS,
    fire: (packed & INPUT_FIRE_BIT) !== 0
  };
}

// Recorder and player ship at M1, not at M9 when determinism.mjs is written
// (section 12.1.2). Headless, DOM-free, and source-agnostic: a stream recorded
// from touch replays identically to the keyboard equivalent, which is the
// property tests/input.mjs asserts at M11.
function createInputRecorder() {
  return { frames: [] };
}

function recordInputFrame(recorder, sample) {
  recorder.frames.push(encodeInputFrame(sample));
  return sample;
}

function createInputPlayer(frames) {
  return { frames, index: 0 };
}

// Past the end of the stream a player returns neutral forever rather than
// throwing, so a replay can run longer than it was recorded.
function playInputFrame(player) {
  if (player.index >= player.frames.length) return { ...INPUT_NEUTRAL_SAMPLE };
  return decodeInputFrame(player.frames[player.index++]);
}

// --- DOM bindings ---------------------------------------------------------
// Called only from main.js. Never at import time.

function bindKeyboardInput(hub, target, windowRef, doc) {
  registerInputSource(hub, INPUT_SOURCE_IDS.KEYBOARD);
  const held = new Set();

  const codeIn = (list, code) => list.indexOf(code) !== -1;

  function refresh() {
    let ax = 0;
    let ay = 0;
    // Opposed keys cancel rather than latching whichever arrived last.
    for (const code of held) {
      if (codeIn(KEY_BINDINGS.up, code)) ay -= 1;
      if (codeIn(KEY_BINDINGS.down, code)) ay += 1;
      if (codeIn(KEY_BINDINGS.left, code)) ax -= 1;
      if (codeIn(KEY_BINDINGS.right, code)) ax += 1;
    }
    ax = Math.sign(ax);
    ay = Math.sign(ay);
    const sector = cardinalToSector(ax, ay);
    // Keyboard expresses movement and facing together (section 17.1.1).
    setSourceIntent(hub, INPUT_SOURCE_IDS.KEYBOARD, sector, sector);

    let firing = false;
    for (const code of held) if (codeIn(KEY_BINDINGS.fire, code)) firing = true;
    // Level, not edge. sampleInput does the edge detection - which is what makes
    // keyboard auto-repeat harmless here.
    setSourceFireHeld(hub, INPUT_SOURCE_IDS.KEYBOARD, firing);
  }

  function isGameKey(code) {
    return codeIn(KEY_BINDINGS.up, code) || codeIn(KEY_BINDINGS.down, code) ||
      codeIn(KEY_BINDINGS.left, code) || codeIn(KEY_BINDINGS.right, code) ||
      codeIn(KEY_BINDINGS.fire, code);
  }

  function onKeyDown(e) {
    if (!isGameKey(e.code)) return;
    // section 9: stop page scroll and button re-activation.
    e.preventDefault();
    held.add(e.code);
    refresh();
  }

  function onKeyUp(e) {
    if (!isGameKey(e.code)) return;
    e.preventDefault();
    held.delete(e.code);
    refresh();
  }

  function onRelease() {
    held.clear();
    releaseAllInput(hub);
  }

  target.addEventListener('keydown', onKeyDown, { passive: false });
  target.addEventListener('keyup', onKeyUp, { passive: false });
  // A key held while the tab loses focus never delivers its keyup.
  windowRef.addEventListener('blur', onRelease);
  // visibilitychange is dispatched at the DOCUMENT, not at window. It does
  // bubble, so a window listener happens to work - but document is the
  // specified target, and this binding is the template that bindGamepadInput
  // (M10) and bindTouchInput (M11) will copy. Bind it where the spec puts it.
  doc.addEventListener('visibilitychange', onRelease);

  return function unbindKeyboardInput() {
    target.removeEventListener('keydown', onKeyDown);
    target.removeEventListener('keyup', onKeyUp);
    windowRef.removeEventListener('blur', onRelease);
    doc.removeEventListener('visibilitychange', onRelease);
  };
}

// ---- core/loop.js ----
// VAULT RAIDER - fixed-timestep loop. SPEC v0.6 sections 1, 14 (M1).
//
// Fixed 60 Hz accumulator, 5-substep cap, clamped frame time, interpolated
// render. Identical behaviour at 60 / 120 / 144 Hz, and no time-skip burst
// after the tab has been backgrounded (section 12.2).
//
// The clock and the scheduler are injected so the loop runs headless under
// Node. No DOM access at import time. Safe to import from tests/.

// SCHEDULER is imported ONLY here. It is not a simulation constant - see the
// block above its declaration in tuning.js. No code reachable from update()
// may read it.

// Pure. This is the whole timing rule, isolated so it can be tested without
// running a real loop.
//
// THE ACCUMULATOR IS DRAINED, NOT CARRIED, WHEN THE SUBSTEP CAP IS HIT.
// Carrying the remainder is the classic spiral-of-death bug: after a 30 s
// background, the leftover time is still owed, so the next frames run capped
// too and the game fast-forwards through the backlog instead of dropping it.
// Draining discards unsimulated time deliberately - a backgrounded game loses
// wall-clock time, which is correct, rather than replaying it in a burst.
function advanceAccumulator(accumulator, frameSec) {
  // Clamped on BOTH sides. The upper bound is the tab-away guard; the lower
  // bound guards a backward clock. performance.now() is monotonic, so a
  // negative delta should be impossible - but an injected clock in a test or a
  // future replay driver is not bound by that, and an unclamped negative would
  // silently drive the accumulator down and under-count steps.
  const clamped = Math.min(Math.max(frameSec, 0), TUNING.maxFrameSec);
  let acc = accumulator + clamped;
  // Epsilon so a value a few ulps short of a whole step still counts as one.
  // See SCHEDULER in tuning.js for why 144 Hz needs this, and why it is safe.
  let steps = Math.floor((acc + SCHEDULER.accumulatorEpsilonSec) / TUNING.dt);

  if (steps > TUNING.maxSubsteps) {
    steps = TUNING.maxSubsteps;
    acc = 0;
  } else {
    // The epsilon can push acc a hair below zero; alpha must not go negative.
    acc = Math.max(0, acc - steps * TUNING.dt);
  }

  return { steps, accumulator: acc, alpha: acc / TUNING.dt };
}

// opts: { update(tick), render(alpha), now(), schedule(cb) }
//
// now() returns seconds. schedule(cb) queues the next frame and returns a
// handle. Both are injected: main.js passes performance.now and
// requestAnimationFrame, tests pass a synthetic clock and a manual pump.
function createLoop(opts) {
  const loop = {
    running: false,
    accumulator: 0,
    tick: 0,
    lastTime: 0,
    handle: null,
    // Diagnostics for the M1 validation: substeps taken on the most recent
    // frame, and the rendered-frame counter.
    lastSteps: 0,
    frames: 0
  };

  function frame() {
    if (!loop.running) return;

    const time = opts.now();
    const frameSec = time - loop.lastTime;
    loop.lastTime = time;

    const advanced = advanceAccumulator(loop.accumulator, frameSec);
    loop.accumulator = advanced.accumulator;
    loop.lastSteps = advanced.steps;

    for (let i = 0; i < advanced.steps; i++) {
      opts.update(loop.tick);
      loop.tick++;
    }

    opts.render(advanced.alpha);
    loop.frames++;

    loop.handle = opts.schedule(frame);
  }

  loop.start = function startLoop() {
    if (loop.running) return;
    loop.running = true;
    loop.lastTime = opts.now();
    loop.accumulator = 0;
    loop.handle = opts.schedule(frame);
  };

  loop.stop = function stopLoop() {
    loop.running = false;
  };

  // Drive one frame by hand. Used by tests and by nothing else.
  loop.pump = frame;

  return loop;
}

// ---- core/gfx.js ----
// VAULT RAIDER - canvas primitives. SPEC v0.6 sections 1, 17.6.
//
// Owns: canvas init, viewport maths, scaling, letter/pillarboxing, and drawing
// primitives. Owns NOTHING about what a floor or a room looks like - scene
// composition is game/render.js (section 13).
//
// computeViewport is pure and DOM-free so it can be tested headless; every
// other function here takes an initialised gfx object and touches the canvas.


// Pure. Logical 320x240 into a CSS-pixel box.
//
// Desktop uses integer scaling so nearest-neighbour upscaling stays crisp.
// allowFractional exists for mobile (section 17.6): integer-only scaling wastes
// too much of a phone screen. Nearest-neighbour still applies either way.
function computeViewport(cssW, cssH, allowFractional) {
  const raw = Math.min(cssW / TUNING.logicalW, cssH / TUNING.logicalH);
  let scale = allowFractional ? raw : Math.floor(raw);
  if (scale < 1) scale = allowFractional ? Math.max(raw, 0) : 1;

  const width = TUNING.logicalW * scale;
  const height = TUNING.logicalH * scale;
  return {
    scale,
    width,
    height,
    // Floored so the blit lands on whole device pixels.
    offsetX: Math.floor((cssW - width) / 2),
    offsetY: Math.floor((cssH - height) / 2)
  };
}

function initGfx(canvas, allowFractional) {
  const ctx = canvas.getContext('2d', { alpha: false });
  const gfx = {
    canvas,
    ctx,
    allowFractional: !!allowFractional,
    viewport: { scale: 1, width: TUNING.logicalW, height: TUNING.logicalH, offsetX: 0, offsetY: 0 },
    dpr: 1
  };
  return gfx;
}

function resizeGfx(gfx, cssW, cssH, devicePixelRatio) {
  const dpr = devicePixelRatio || 1;
  const viewport = computeViewport(cssW, cssH, gfx.allowFractional);

  gfx.dpr = dpr;
  gfx.viewport = viewport;
  gfx.canvas.width = Math.round(viewport.width * dpr);
  gfx.canvas.height = Math.round(viewport.height * dpr);
  gfx.canvas.style.width = viewport.width + 'px';
  gfx.canvas.style.height = viewport.height + 'px';

  // Set after every resize: assigning to canvas.width resets all context state.
  gfx.ctx.imageSmoothingEnabled = false;
  return viewport;
}

function gfxBeginFrame(gfx, clearColor) {
  const { ctx } = gfx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = clearColor;
  ctx.fillRect(0, 0, gfx.canvas.width, gfx.canvas.height);
  // Everything after this point draws in logical 320x240 coordinates.
  const s = gfx.viewport.scale * gfx.dpr;
  ctx.setTransform(s, 0, 0, s, 0, 0);
}

function gfxFillRect(gfx, x, y, w, h, color) {
  gfx.ctx.fillStyle = color;
  gfx.ctx.fillRect(x, y, w, h);
}

function gfxStrokeRect(gfx, x, y, w, h, color, lineWidth) {
  gfx.ctx.strokeStyle = color;
  gfx.ctx.lineWidth = lineWidth;
  gfx.ctx.strokeRect(x, y, w, h);
}

// Debug text only. Shipped HUD text renders from the sprite atlas at M8;
// canvas fillText is here so M1 has something legible to validate against.
function gfxDrawDebugText(gfx, text, x, y, color, sizePx) {
  gfx.ctx.fillStyle = color;
  gfx.ctx.font = sizePx + 'px monospace';
  gfx.ctx.textBaseline = 'top';
  gfx.ctx.fillText(text, x, y);
}

function gfxEndFrame(gfx) {
  gfx.ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- main.js ----
// VAULT RAIDER - boot and wiring. SPEC v0.6 section 14 (M1).
//
// Wiring only. No game logic lives here.
//
// M1 SCAFFOLDING NOTICE: mainDebugState and mainRenderDebug below are the
// milestone's stated validation artifact - the "debug rect at exactly 60 Hz"
// from section 14. They are NOT the game. M2 replaces them with game/state.js
// and game/render.js. The debug entity carries a persistent `facing` field
// specifically to demonstrate section 17.1.1: facing survives key release.


const MAIN_BG_COLOR = '#101018';
const MAIN_FIELD_COLOR = '#1c1c2c';
const MAIN_PIP_COLOR = '#f8f0c0';
const MAIN_FACING_COLOR = '#e04030';
const MAIN_TEXT_COLOR = '#8090b0';
const MAIN_FIRE_FLASH_TICKS = 8;
const MAIN_DEBUG_SIZE = 6;
const MAIN_FACING_LEN = 6;
const MAIN_TEXT_SIZE = 6;
const MAIN_FPS_WINDOW = 30;

function createMainDebugState() {
  return {
    x: TUNING.logicalW / 2,
    y: TUNING.logicalH / 2,
    prevX: TUNING.logicalW / 2,
    prevY: TUNING.logicalH / 2,
    // PERSISTENT entity facing (section 17.1.1). Starts East. Updated only when
    // facingLatch !== -1; never cleared on neutral input.
    facing: 2,
    fireFlash: 0,
    ticks: 0,
    lastSample: { dir: DIR_NEUTRAL, fire: false, facingLatch: DIR_NEUTRAL }
  };
}

function updateMainDebug(state, input) {
  state.prevX = state.x;
  state.prevY = state.y;

  // facingLatch is an EVENT. Read it, do not store it. Entity facing persists.
  if (input.facingLatch !== DIR_NEUTRAL) state.facing = input.facingLatch;

  // dir is MOVEMENT intent, and is independent of facing.
  if (input.dir !== DIR_NEUTRAL) {
    const d = DIRS[input.dir];
    const speed = TUNING.player.speedFloor * TUNING.floorSpeedMul[0];
    state.x += d.dx * speed;
    state.y += d.dy * speed;
  }

  const half = MAIN_DEBUG_SIZE / 2;
  state.x = Math.max(half, Math.min(TUNING.logicalW - half, state.x));
  state.y = Math.max(half, Math.min(TUNING.logicalH - half, state.y));

  if (input.fire) state.fireFlash = MAIN_FIRE_FLASH_TICKS;
  else if (state.fireFlash > 0) state.fireFlash--;

  state.lastSample = input;
  state.ticks++;
}

function mainRenderDebug(gfx, state, alpha, loop, fps) {
  gfxBeginFrame(gfx, MAIN_BG_COLOR);
  gfxFillRect(gfx, 0, 0, TUNING.logicalW, TUNING.logicalH, MAIN_FIELD_COLOR);

  // Interpolated render: draw between the last two simulated positions.
  const x = state.prevX + (state.x - state.prevX) * alpha;
  const y = state.prevY + (state.y - state.prevY) * alpha;
  const half = MAIN_DEBUG_SIZE / 2;

  gfxFillRect(gfx, Math.round(x - half), Math.round(y - half),
    MAIN_DEBUG_SIZE, MAIN_DEBUG_SIZE,
    state.fireFlash > 0 ? MAIN_FACING_COLOR : MAIN_PIP_COLOR);

  // Facing indicator. Persists with no keys held - that is the point of it.
  const d = DIRS[state.facing];
  gfxStrokeRect(gfx,
    Math.round(x + d.dx * MAIN_FACING_LEN) - 1,
    Math.round(y + d.dy * MAIN_FACING_LEN) - 1,
    2, 2, MAIN_FACING_COLOR, 1);

  const s = state.lastSample;
  const lines = [
    'M1 DEBUG  tick ' + state.ticks,
    'fps ' + fps.toFixed(1) + '  substeps ' + loop.lastSteps,
    'dir ' + s.dir + '  face(evt) ' + s.facingLatch + '  fire ' + (s.fire ? 1 : 0),
    'entity facing ' + state.facing + ' ' + DIRS[state.facing].name
  ];
  for (let i = 0; i < lines.length; i++) {
    gfxDrawDebugText(gfx, lines[i], 4, 4 + i * (MAIN_TEXT_SIZE + 2), MAIN_TEXT_COLOR, MAIN_TEXT_SIZE);
  }

  gfxEndFrame(gfx);
}

function bootVaultRaider(doc, win) {
  const canvas = doc.getElementById('vr-canvas');
  const gfx = initGfx(canvas, false);

  const hub = createInputHub();
  bindKeyboardInput(hub, win, win, doc);

  // Every session records its input stream. Determinism is a v1 requirement
  // (section 15), so the recorder runs from M1 rather than being retrofitted.
  const recorder = createInputRecorder();
  const state = createMainDebugState();

  let fps = 0;
  let fpsFrames = 0;
  let fpsLast = 0;

  function fitCanvas() {
    resizeGfx(gfx, win.innerWidth, win.innerHeight, win.devicePixelRatio);
  }
  fitCanvas();
  win.addEventListener('resize', fitCanvas);

  const loop = createLoop({
    now: () => win.performance.now() / 1000,
    schedule: (cb) => win.requestAnimationFrame(cb),
    update: () => {
      // sampleInput is called EXACTLY once per tick. It advances edge detection.
      const input = sampleInput(hub);
      recordInputFrame(recorder, input);
      updateMainDebug(state, input);
    },
    render: (alpha) => {
      fpsFrames++;
      const t = win.performance.now();
      if (t - fpsLast >= MAIN_FPS_WINDOW * 16) {
        fps = (fpsFrames * 1000) / (t - fpsLast);
        fpsFrames = 0;
        fpsLast = t;
      }
      mainRenderDebug(gfx, state, alpha, loop, fps);
    }
  });

  loop.start();
  return { loop, hub, gfx, state, recorder };
}

// Guarded so that importing main.js under Node (build checks, tooling) does not
// try to touch the DOM.
if (typeof document !== 'undefined' && typeof window !== 'undefined') {
  bootVaultRaider(document, window);
}
</script>
